<script>/* Study Campus theme: light unless the student switched dark mode on in the menu. Runs before the page draws, so there is no flash. */try{if(JSON.parse(localStorage.getItem('shq_theme')||'null')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>

<style>
/* Shared by every Study Campus design: reset, the form dialog, toasts, the preview bar.
   Each design (studyhq-skin-*.js) brings its own layout and sets the --d-* colours used here. */
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#main:focus{outline:none}
.shq-solo{max-width:560px;margin:80px auto;padding:0 20px;display:grid;gap:14px}
.shq-spin{width:28px;height:28px;border:3px solid rgba(26,107,255,.2);border-top-color:#1a6bff;border-radius:50%;animation:shqspin .7s linear infinite;margin:6rem auto}
@keyframes shqspin{to{transform:rotate(360deg)}}
#demoBar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:#fff6e0;color:#6b4500;font-size:.8rem;font-weight:600;padding:8px 14px;border-bottom:1px solid #f3dfae}
.shq-concepts{display:inline-flex;gap:4px;background:#fff;border:1px solid #efd9a3;border-radius:999px;padding:3px;flex-wrap:wrap}
.shq-concepts button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:.78rem;font-weight:700;color:#6b4500;cursor:pointer;min-height:30px}
.shq-concepts button[aria-pressed="true"]{background:#0f2460;color:#fff}
dialog{margin:auto;border:0;border-radius:var(--d-radius,16px);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 30px 80px rgba(8,18,48,.3);color:var(--d-ink,#0f172a);background:var(--d-surface,#fff)}
dialog::backdrop{background:rgba(15,23,42,.42)}
.dlg{padding:24px}
.dlg h2{font-family:var(--d-display,inherit);font-size:1.3rem;font-weight:700;margin-bottom:18px;letter-spacing:-.01em}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label{font-size:.8rem;font-weight:700;color:var(--d-ink2,#334155)}
.f .opt{font-weight:500;color:var(--d-muted,#64748b)}
.f input,.f select,.f textarea{border:1px solid var(--d-line,#dfe4ec);border-radius:calc(var(--d-radius,16px) * .6);padding:10px 12px;font-size:.95rem;background:var(--d-field,#fff);width:100%}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--d-accent,#1a6bff);outline-offset:1px;border-color:transparent}
.f textarea{min-height:84px;resize:vertical;line-height:1.5}
.f textarea.tall{min-height:190px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.f2{grid-template-columns:1fr}}
.hint{font-size:.8rem;color:var(--d-muted,#64748b);line-height:1.5;margin:-4px 0 12px}
.dlg .acts{display:flex;gap:8px;margin-top:6px;align-items:center}
.dlg .acts .grow{flex:1}
.dlg .err{color:#b42318;font-size:.84rem;min-height:1.2em;margin-bottom:8px}
.dlg .acts button{min-height:42px;padding:0 16px;border-radius:calc(var(--d-radius,16px) * .6);font-weight:700;font-size:.88rem;cursor:pointer;border:1px solid transparent;background:none}
.dlg .acts .save{background:var(--d-accent,#1a6bff);color:#fff}
.dlg .acts .cancel{color:var(--d-ink2,#334155)}
.dlg .acts .del{color:#b42318}
.shq-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#101828;color:#fff;padding:11px 18px;border-radius:12px;font-size:.88rem;font-weight:600;z-index:3000;box-shadow:0 12px 32px rgba(0,0,0,.25)}
/* Daily-learning blocks (shared by every design; each design sets the --d-* colours and may restyle). */
.shq-d-muted{color:var(--d-muted);font-size:.88rem;line-height:1.55}
.shq-d-fine{color:var(--d-muted);font-size:.74rem;line-height:1.5;margin-top:8px}
.shq-d-classes{list-style:none;display:grid;gap:2px;container-type:inline-size}
.shq-d-classes li{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--d-line)}
.shq-d-classes li:last-child{border-bottom:0}
.shq-d-classes .t{font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums;color:var(--d-ink)}
.shq-d-classes .t small{display:block;font-weight:600;font-size:.72rem;color:var(--d-muted)}
.shq-d-classes .b{border-left:3px solid var(--c);padding-left:10px;min-width:0}
.shq-d-classes .b b{display:block;font-size:.92rem;color:var(--d-ink)}
.shq-d-classes .b small{font-size:.76rem;color:var(--d-muted)}
.shq-d-classes li.done .b b{color:var(--d-ink2)}
@container (max-width:420px){.shq-d-classes li{grid-template-columns:52px minmax(0,1fr)}.shq-d-classes li>.shq-btn,.shq-d-classes li>.shq-d-tag{grid-column:2;justify-self:start}}
.shq-d-classes li.now{background:color-mix(in srgb,var(--d-accent) 7%,transparent);border-radius:10px;padding-left:8px;padding-right:8px}
.shq-d-tag{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--d-ink) 7%,transparent);color:var(--d-ink2);white-space:nowrap}
.shq-d-tag.now{background:var(--d-accent);color:#fff}
.shq-d-tag.ok{background:color-mix(in srgb,#2e9d6a 16%,transparent);color:color-mix(in srgb,#2e9d6a 70%,var(--d-ink))}
.shq-d-review{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.shq-d-review .n b{display:block;font-size:2.2rem;font-weight:800;line-height:1;color:var(--d-ink);font-family:var(--d-display,inherit)}
.shq-d-review .n span{font-size:.72rem;font-weight:700;color:var(--d-muted)}
.shq-d-review .x p{font-size:.86rem;color:var(--d-ink2);font-weight:600}
.shq-d-review .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.shq-d-review .chips span{display:inline-flex;gap:5px;align-items:center;font-size:.74rem;font-weight:700;color:var(--d-muted)}
.shq-d-review.empty{display:block}.shq-d-review.empty b{font-size:.95rem;color:var(--d-ink)}.shq-d-review.empty p{font-size:.84rem;color:var(--d-muted);margin-top:3px}
@media(max-width:560px){.shq-d-review{grid-template-columns:auto minmax(0,1fr)}.shq-d-review>a{grid-column:1/-1}}
.shq-d-sugs{display:grid;gap:10px}
.shq-d-sug{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--d-line);border-radius:calc(var(--d-radius,14px) * .8);background:var(--d-surface)}
.shq-d-sug .ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--d-accent) 12%,transparent);color:var(--d-accent)}
.shq-d-sug.k-rescue .ico{background:color-mix(in srgb,#c77b1f 15%,transparent);color:#c77b1f}
.shq-d-sug b{display:block;font-size:.9rem;color:var(--d-ink);line-height:1.35}
.shq-d-sug small{display:block;font-size:.78rem;color:var(--d-muted);margin-top:2px;line-height:1.45}
.shq-d-sug .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.shq-d-sugs{container-type:inline-size}
@container (max-width:560px){.shq-d-sug{grid-template-columns:34px minmax(0,1fr)}.shq-d-sug .acts{grid-column:2;justify-content:flex-start}}
.shq-d-record .days{display:flex;gap:6px;flex-wrap:wrap}
.shq-d-record .days span{display:grid;justify-items:center;gap:4px;font-size:.68rem;font-weight:800;color:var(--d-muted);min-width:30px}
.shq-d-record .days i{width:22px;height:22px;border-radius:50%;border:2px solid var(--d-line);display:block}
.shq-d-record .days .on i{background:var(--d-accent);border-color:var(--d-accent)}
.shq-d-record .days .fut i{border-style:dashed;opacity:.6}
.shq-d-record .days .today{color:var(--d-ink)}
.shq-d-record .figs{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.shq-d-record .figs span{font-size:.74rem;color:var(--d-muted);font-weight:600}
.shq-d-record .figs b{display:block;font-size:1.15rem;color:var(--d-ink);font-weight:800}
.shq-d-card{border:1px solid var(--d-line);border-radius:var(--d-radius,14px);background:var(--d-surface);padding:22px;margin-bottom:18px}
.shq-d-card>b{display:block;font-size:1.05rem;color:var(--d-ink)}
.shq-d-card>p{color:var(--d-ink2);font-size:.88rem;margin:6px 0 14px;line-height:1.5}
.shq-d-card.live{border-top:4px solid var(--c,var(--d-accent))}
.shq-d-card .top{display:flex;gap:12px;align-items:center;justify-content:space-between}
.shq-d-card .top small{font-size:.76rem;font-weight:800;color:var(--d-muted);font-variant-numeric:tabular-nums}
.shq-d-prog{flex:1;height:5px;border-radius:5px;background:var(--d-line);overflow:hidden;max-width:220px}
.shq-d-prog i{display:block;height:100%;background:var(--c,var(--d-accent))}
.shq-d-card .front{font-size:1.3rem;line-height:1.4;color:var(--d-ink);font-weight:700;margin:22px 0 10px;font-family:var(--d-display,inherit)}
.shq-d-card .back{font-size:1.02rem;line-height:1.55;color:var(--d-ink2);padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--d-accent) 8%,transparent);margin-bottom:6px}
.shq-d-card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.shq-d-card kbd{font:inherit;font-size:.68rem;font-weight:800;opacity:.7;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:4px}
.shq-d-ask{display:flex;gap:8px;align-items:center;border:1px solid var(--d-line);border-radius:999px;padding:4px 4px 4px 14px;background:var(--d-field,var(--d-surface));color:var(--d-muted)}
.shq-d-ask input{flex:1;min-width:0;border:0;background:none;padding:8px 4px;font-size:.92rem;color:var(--d-ink)}
.shq-d-ask input:focus{outline:none}
.shq-d-ask:focus-within{outline:2px solid var(--d-accent);outline-offset:1px}
.shq-d-answer{margin-top:12px;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--d-accent) 8%,transparent);color:var(--d-ink);line-height:1.55;font-size:.92rem}
.shq-d-hits{list-style:none;display:grid;gap:10px;margin-top:12px}
.shq-d-hits li{border:1px solid var(--d-line);border-radius:12px;padding:12px 14px;background:var(--d-surface)}
.shq-d-hits b{display:block;font-size:.88rem;color:var(--d-ink);margin-bottom:4px}
.shq-d-hits p{font-size:.86rem;color:var(--d-ink2);margin-top:6px;line-height:1.5}
.shq-d-concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.shq-d-concepts .cx{border:1px solid var(--d-line);border-radius:12px;padding:12px;background:var(--d-surface);display:grid;gap:4px}
.shq-d-concepts b{font-size:.9rem;color:var(--d-ink)}
.shq-d-concepts small{font-size:.72rem;color:var(--d-muted)}
.shq-d-concepts .bar{display:block;height:4px;border-radius:4px;background:var(--d-line);overflow:hidden;margin-top:4px}
.shq-d-concepts .bar i{display:block;height:100%;background:var(--d-accent)}
.shq-d-concepts em{font-style:normal;font-size:.7rem;font-weight:700;color:var(--d-muted)}
.shq-d-decks{display:grid;gap:8px}
.shq-d-decks .dk{border-left:3px solid var(--c);padding:6px 0 6px 12px}
.shq-d-decks b{display:block;font-size:.9rem;color:var(--d-ink)}
.shq-d-decks span{font-size:.76rem;color:var(--d-muted)}
.shq-d-ideas{display:grid;gap:10px}
.shq-d-ideas .idea{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border:1px dashed var(--d-line);border-radius:12px;padding:12px}
.shq-d-ideas b{display:block;font-size:.86rem;color:var(--d-ink)}
.shq-d-ideas small{display:block;font-size:.8rem;color:var(--d-ink2);margin:3px 0 6px;line-height:1.45}
.shq-d-ideas .src{font-size:.72rem;color:var(--d-muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.shq-d-help{margin-top:16px;font-size:.84rem;color:var(--d-ink2)}
.shq-d-help summary{cursor:pointer;font-weight:700;color:var(--d-ink)}
.shq-d-help ul{margin:10px 0 0 18px;display:grid;gap:6px;line-height:1.5}
.shq-d-help code{font-size:.8rem;background:color-mix(in srgb,var(--d-ink) 8%,transparent);padding:1px 5px;border-radius:4px}
.shq-learn{max-width:1180px;margin:0 auto}
.shq-learn-h h1{font-family:var(--d-display,inherit);font-size:clamp(1.8rem,3.4vw,2.5rem);color:var(--d-ink);letter-spacing:-.01em}
.shq-learn-h p{color:var(--d-ink2);margin-top:6px;max-width:640px;line-height:1.55}
.shq-learn h2{font-size:1rem;font-weight:800;color:var(--d-ink);margin:26px 0 12px}
.shq-learn-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:32px}
@media(max-width:900px){.shq-learn-grid{grid-template-columns:1fr;gap:0}}
.shq-timer{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:2500;display:flex;gap:10px;align-items:center;background:#101828;color:#fff;padding:10px 12px 10px 14px;border-radius:999px;box-shadow:0 14px 34px rgba(0,0,0,.3)}
.shq-timer b{font-variant-numeric:tabular-nums;font-size:1rem;display:block;line-height:1.1}
.shq-timer small{display:block;font-size:.7rem;opacity:.75;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shq-timer button{border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:.78rem;padding:7px 12px;cursor:pointer;min-height:32px}
@media(max-width:700px){.shq-timer{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

/* Release 1 screens shared by the design: library, settings, onboarding, files, import */
.shq-page{display:grid;gap:18px;max-width:1080px}
.shq-page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.shq-page-h h1{font-family:var(--d-display,inherit);font-size:clamp(1.6rem,3vw,2.1rem);font-weight:800;letter-spacing:-.02em;color:var(--d-ink,#0f172a)}
.shq-page-h p{color:var(--d-muted,#64748b);max-width:640px;line-height:1.55;margin-top:6px;font-size:.92rem}
.shq-sec{background:var(--d-surface,#fff);border:1px solid var(--d-line,#e2e8f0);border-radius:var(--d-radius,16px);padding:18px 20px;display:grid;gap:12px}
.shq-sec h2{font-size:1.02rem;font-weight:800;color:var(--d-ink,#0f172a);display:flex;align-items:baseline;gap:10px}
.shq-sec h2 small{font-size:.76rem;font-weight:600;color:var(--d-muted,#64748b)}
.shq-row{display:flex;gap:8px;flex-wrap:wrap}
.shq-capbar{display:inline-flex;gap:6px;flex-wrap:wrap}
.shq-chips{display:flex;gap:6px;flex-wrap:wrap}
.shq-chips button{border:1px solid var(--d-line,#e2e8f0);background:var(--d-surface,#fff);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:34px;color:var(--d-ink2,#334155)}
.shq-chips button[aria-pressed="true"]{background:var(--d-accent,#1a6bff);border-color:var(--d-accent,#1a6bff);color:#fff}
.shq-lib-search{display:flex;align-items:center;gap:8px}
.shq-files{display:grid;gap:8px}
.shq-file{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--d-line,#e2e8f0);border-radius:calc(var(--d-radius,16px)*.7)}
.shq-file .fi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#eef3ee;color:var(--d-accent,#1a6bff)}
.shq-file .fi.pdf{background:#fbebeb;color:#b42318}
.shq-file .ft b{display:block;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--d-ink,#0f172a)}
.shq-file .shq-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.76rem;color:var(--d-muted,#64748b);margin-top:3px;align-items:center}
.shq-file .fa{display:flex;gap:4px;align-items:center}
.shq-notes{columns:240px;column-gap:12px}
.shq-note-c{break-inside:avoid;margin-bottom:12px;border:1px solid var(--d-line,#e2e8f0);border-top:4px solid var(--c);border-radius:calc(var(--d-radius,16px)*.7);padding:12px 14px;display:grid;gap:8px;background:var(--d-surface,#fff)}
.shq-note-c h3{font-size:.92rem;display:flex;gap:8px;align-items:center;color:var(--d-ink,#0f172a)}
.shq-note-c p{font-size:.84rem;line-height:1.5;color:var(--d-ink2,#334155);white-space:pre-wrap;overflow-wrap:anywhere}
.shq-note-c .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem}
.shq-list{list-style:none;display:grid;gap:6px}
.shq-list li{display:flex;gap:12px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--d-line,#e2e8f0)}
.shq-list li:last-child{border-bottom:0}
.shq-list .grow{flex:1;min-width:0}.shq-list b{display:block;font-size:.9rem}.shq-list small{font-size:.78rem;color:var(--d-muted,#64748b)}
.shq-btn.danger{color:#b42318}
.shq-steps{display:grid;gap:12px;counter-reset:s;list-style:none}
.shq-steps li{counter-increment:s;background:var(--d-surface,#fff);border:1px solid var(--d-line,#e2e8f0);border-radius:var(--d-radius,16px);padding:18px 20px 18px 64px;position:relative;display:grid;gap:8px}
.shq-steps li::before{content:counter(s);position:absolute;left:20px;top:18px;width:30px;height:30px;border-radius:50%;background:var(--d-accent,#1a6bff);color:#fff;font-weight:800;display:grid;place-items:center}
.shq-steps b{font-size:1.02rem;color:var(--d-ink,#0f172a)}.shq-steps p{color:var(--d-ink2,#334155);font-size:.88rem;line-height:1.5}
.shq-exam-banner{display:flex;gap:10px;align-items:center;background:#fdf3e4;border:1px solid #f0d9b0;color:#7a4b0c;border-radius:14px;padding:10px 14px;font-size:.88rem;margin-bottom:16px}
.shq-quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.shq-quick button{border:1px solid var(--d-line,#e2e8f0);background:var(--d-surface,#fff);border-radius:16px;padding:16px 10px;display:grid;gap:4px;justify-items:center;cursor:pointer;color:var(--d-ink,#0f172a);min-height:110px}
.shq-quick button:hover,.shq-quick button:focus-visible{border-color:var(--d-accent,#1a6bff)}
.shq-quick small{font-size:.72rem;color:var(--d-muted,#64748b);text-align:center}
.shq-picks{display:grid;gap:6px;max-height:44vh;overflow:auto}
.shq-pick{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--d-line,#e2e8f0);border-radius:12px;cursor:pointer}
.shq-pick input{margin-top:4px;width:18px;height:18px;accent-color:var(--d-accent,#1a6bff)}
.shq-pick b{display:block;font-size:.88rem}.shq-pick small{font-size:.78rem;color:var(--d-muted,#64748b)}
@media(max-width:560px){.shq-file{grid-template-columns:36px minmax(0,1fr)}.shq-file .fa{grid-column:2}.shq-quick{grid-template-columns:1fr}.shq-quick button{min-height:0;grid-template-columns:auto 1fr;justify-items:start;text-align:left}}
.shq-where{margin:4px 0 12px;border:1px solid var(--d-line,#e2e8f0);border-radius:12px;padding:8px 12px;font-size:.84rem}
.shq-where summary{cursor:pointer;font-weight:700;color:var(--d-accent,#1a6bff);min-height:28px;display:flex;align-items:center}
.shq-where ul{list-style:none;display:grid;gap:8px;margin:8px 0}.shq-where li{line-height:1.45;color:var(--d-ink2,#334155)}.shq-where b{color:var(--d-ink,#0f172a)}
[dir="rtl"] .shq-steps li{padding:18px 64px 18px 20px}[dir="rtl"] .shq-steps li::before{left:auto;right:20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="site.css">
<script src="ui.js"></script>
<script src="analytics.js" defer></script>
</head>
<body>
<a data-i18n="studyhq.skip-to-content" class="skip-link" href="#main">Skip to content</a>
<header id="site-nav" data-nav="app"></header>
<script src="site-nav.js"></script>
<div id="demoBar" hidden></div>
<!-- ph-no-capture: analytics session replay never records anything inside Study Campus (notes, files, cards). -->
<div id="hq" class="ph-no-capture"><div class="shq-spin" role="status" aria-label="Loading"></div></div>
<input type="file" id="shqPhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="shqPdf" accept="application/pdf,.pdf" hidden>

<dialog id="dlg" class="ph-no-capture" aria-labelledby="dlgTitle">
  <form class="dlg" id="dlgForm" method="dialog" novalidate>
    <h2 id="dlgTitle"></h2>
    <div id="dlgFields"></div>
    <div class="err" id="dlgErr" role="alert"></div>
    <div class="acts">
      <button type="button" class="del" id="dlgDelete" hidden data-i18n="studyhq.delete">Delete</button>
      <span class="grow"></span>
      <button type="button" class="cancel" id="dlgCancel" data-i18n="studyhq.cancel">Cancel</button>
      <button type="submit" class="save" id="dlgSave" data-i18n="studyhq.save">Save</button>
    </div>
  </form>
</dialog>

<script src="studyhq.js?v=12"></script>
</body>
</html>
