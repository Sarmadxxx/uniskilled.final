<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="sentry.js"></script>
<link rel="icon" href="favicon.ico?v=20261101" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=20261101">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261101">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1a6bff">
<title data-i18n="course.title">Course — UniSkilled</title>
<meta data-i18n-attr="content:course.meta.description" name="description" content="Student tutors who passed this university course, and questions from classmates.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="UniSkilled">
<meta data-i18n-attr="content:course.meta.og-title" property="og:title" content="Course — UniSkilled">
<meta data-i18n-attr="content:course.meta.og-description" property="og:description" content="Student tutors who passed this university course, and questions from classmates.">
<meta property="og:image" content="https://uniskilled.com/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="vendor/supabase-js/2.39.3/supabase.js"></script>
<script src="supabase-config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1a6bff;--blue-dark:#01367c;--blue-pale:#eef4ff;--ink:#0f172a;--ink2:#334155;--mid:#5b6474;--border:#e2e8f0;--off:#f8fafc;--green:#047857;--green-bg:#ecfdf5;}
body{font-family:'Manrope',sans-serif;background:var(--off);color:var(--ink);min-height:100vh;}
.page{max-width:960px;margin:0 auto;padding:1.5rem 16px 3.5rem;}
@media(min-width:700px){.page{padding:2rem 5% 4rem;}}
.crumb{font-size:.85rem;margin-bottom:1rem;}
.crumb a{color:var(--blue);text-decoration:none;font-weight:600;}
.head{background:#fff;border:1px solid var(--border);border-radius:16px;padding:1.4rem 1.4rem 1.25rem;display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;}
.head h1{font-size:1.55rem;font-weight:800;letter-spacing:-.01em;line-height:1.25;}
.head .sub{font-size:.92rem;color:var(--ink2);margin-top:.25rem;}
.head .unis{font-size:.82rem;color:var(--mid);margin-top:.4rem;}
.stats{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.85rem;}
.pill{font-size:.75rem;font-weight:700;padding:.28rem .65rem;border-radius:999px;background:var(--blue-pale);color:var(--blue-dark);}
.pill.muted{background:#f1f5f9;color:var(--mid);font-weight:600;}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 1.1rem;border-radius:10px;font:inherit;font-size:.88rem;font-weight:700;text-decoration:none;cursor:pointer;border:1px solid transparent;white-space:nowrap;}
.btn.primary{background:var(--blue);color:#fff;}
.btn.primary:hover{background:#1559d6;}
.btn.ghost{background:#fff;color:var(--blue-dark);border-color:#c9d8f5;}
.btn.ghost:hover{background:var(--blue-pale);}
.btn.ghost[aria-pressed="true"]{background:var(--blue-pale);border-color:var(--blue);}
.btn:disabled{opacity:.6;cursor:wait;}
.section{margin-top:1.75rem;}
.section h2{font-size:1.05rem;font-weight:800;margin-bottom:.25rem;}
.section .hint{font-size:.84rem;color:var(--mid);margin-bottom:.85rem;}
.tutors{display:grid;gap:.75rem;grid-template-columns:1fr;}
@media(min-width:700px){.tutors{grid-template-columns:1fr 1fr;}}
.tutor{background:#fff;border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.65rem;}
.t-top{display:flex;gap:.75rem;align-items:center;min-width:0;}
.av{width:46px;height:46px;border-radius:50%;background:var(--blue-pale);color:var(--blue-dark);font-weight:800;font-size:.85rem;display:grid;place-items:center;flex-shrink:0;overflow:hidden;}
.av img{width:100%;height:100%;object-fit:cover;}
.t-name{font-size:.98rem;font-weight:800;color:var(--ink);text-decoration:none;}
.t-name:hover{color:var(--blue);}
.t-meta{display:flex;gap:.5rem;flex-wrap:wrap;font-size:.78rem;color:var(--mid);margin-top:2px;}
.verified{color:var(--green);font-weight:700;}
.same-uni{font-size:.72rem;font-weight:700;color:var(--green);background:var(--green-bg);padding:.18rem .55rem;border-radius:999px;}
.passed{font-size:.84rem;color:var(--ink2);line-height:1.5;}
.passed .grade{color:var(--green);font-weight:700;}
.passed .grade span{color:var(--mid);font-weight:400;}
.t-foot{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-top:auto;}
.rate{font-size:.95rem;font-weight:800;}
.rate span{font-size:.78rem;color:var(--mid);font-weight:600;}
.qs{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.q{display:block;padding:.9rem 1.1rem;border-bottom:1px solid var(--border);text-decoration:none;color:inherit;}
.q:last-child{border-bottom:0;}
.q:hover{background:var(--off);}
.q-text{font-size:.9rem;color:var(--ink);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.q-meta{font-size:.76rem;color:var(--mid);margin-top:.3rem;display:flex;gap:.6rem;flex-wrap:wrap;}
.q-meta .answered{color:var(--green);font-weight:700;}
.empty{background:#fff;border:1px dashed var(--border);border-radius:14px;padding:1.5rem 1.25rem;text-align:center;color:var(--mid);font-size:.9rem;line-height:1.6;}
.empty .btn{margin-top:.75rem;}
.msg{font-size:.82rem;color:#b91c1c;margin-top:.5rem;min-height:1em;}
.spinner{width:28px;height:28px;border:3px solid rgba(26,107,255,.2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:3rem auto;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="site.css">
<script src="ui.js"></script>
<script src="analytics.js" defer></script>
</head>
<body>
<a data-i18n="course.skip-to-content" class="skip-link" href="#main">Skip to content</a>
<header id="site-nav"></header>
<script src="site-nav.js"></script>

<main class="page" id="main">
  <div data-i18n="course.all-courses" class="crumb"><a href="courses.html">← All courses</a></div>
  <div id="content"><div data-i18n-attr="aria-label:course.loading-course.arialabel" class="spinner" role="status" aria-label="Loading course"></div></div>
</main>

<script>
function __esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/`/g,'&#96;');}
function __safeUrl(u){u=String(u==null?'':u).trim();if(!u)return '';if(/^(https?:)?\/\//i.test(u)||/^data:image\//i.test(u)||/^(?![a-z][a-z0-9+.-]*:)[^\s]*$/i.test(u))return __esc(u);return '#';}

// Text shown by this page's script, in the page's language (English unchanged; locales/*/page.course.json).
function __pick(en, v) { return typeof en === 'object' ? (v && v.count === 1 ? en.one : en.other) : en; }
function T(k, en, v) { return window.I18N ? I18N.t('course.js.' + k, en, v) : __pick(en, v).replace(/\{\{(\w+)\}\}/g, function (m, x) { return v && x in v ? v[x] : m; }); }
function H(k, en, v) { return window.I18N ? I18N.h('course.js.' + k, en, v) : __pick(en, v).replace(/\{\{(\w+)\}\}/g, function (m, x) { return v && x in v ? __esc(v[x]) : m; }); }
const NON_EN = !!(window.I18N && I18N.lang && I18N.lang !== 'en');
const CURRENCY_SYMBOLS = { GBP:'£', EUR:'€', USD:'$' };
const currSymbol = c => CURRENCY_SYMBOLS[c] || c || '€';
// Same rule as the database's course_key(): letters and digits only, lower case.
const courseKey = s => String(s || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
const sameUni = (a, b) => !!a && !!b && (a.toLowerCase().includes(b.toLowerCase()) || b.toLowerCase().includes(a.toLowerCase()));
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

const _sb = window.supabase.createClient(USK_CONFIG.url, USK_CONFIG.anonKey, { realtime: { params: { eventsPerSecond: 0 } } });

const KEY = courseKey(new URLSearchParams(location.search).get('c'));
let me = null, myRole = null, myUni = '', label = '', following = false;

function setSeo(title, desc) {
  document.title = title + ' — UniSkilled';
  const set = (sel, attr, val) => { const el = document.querySelector(sel); if (el) el.setAttribute(attr, val); };
  set('meta[name="description"]', 'content', desc);
  set('meta[property="og:title"]', 'content', title + ' — UniSkilled');
  set('meta[property="og:description"]', 'content', desc);
  const url = 'https://uniskilled.com/course.html?c=' + encodeURIComponent(KEY);
  let link = document.querySelector('link[rel="canonical"]');
  if (!link) { link = document.createElement('link'); link.rel = 'canonical'; document.head.appendChild(link); }
  link.href = url;
  set('meta[property="og:url"]', 'content', url);
}

function noindex() {
  const m = document.createElement('meta'); m.name = 'robots'; m.content = 'noindex'; document.head.appendChild(m);
}

async function whoAmI() {
  try {
    const { data: { session } } = await _sb.auth.getSession();
    if (!session) return;
    me = session.user.id;
    myRole = (session.user.user_metadata || {}).role || 'student';
    if (myRole !== 'tutor') {
      const { data: sp } = await _sb.from('student_profiles').select('university').eq('user_id', me).maybeSingle();
      myUni = sp?.university || '';
    }
  } catch (e) {}
}

async function load() {
  const box = document.getElementById('content');
  if (!KEY) { noindex(); box.innerHTML = '<div class="empty">' + H('incomplete', 'This course link is incomplete.') + ' <a href="courses.html" style="color:var(--blue);font-weight:700;text-decoration:none">' + H('browse', 'Browse all courses') + '</a></div>'; return; }

  const [, tcRes, statsRes, postsRes] = await Promise.all([
    whoAmI(),
    _sb.from('tutor_courses').select('tutor_id,course_code,course_name,university,semester,grade').eq('course_key', KEY),
    _sb.rpc('course_stats', { p_course_key: KEY }),
    _sb.from('feed_posts').select('id,content,author_name,course_code,subject,reply_count,has_tutor_answer,created_at,post_type').eq('course_key', KEY).neq('post_type', 'share').order('created_at', { ascending: false }).limit(5),
  ]);
  if (tcRes.error) { box.innerHTML = '<div class="empty">' + H('load-failed', 'Could not load this course. Please refresh the page or try again in a moment.') + '</div>'; return; }

  const rows = tcRes.data || [];
  const tutorIds = [...new Set(rows.map(r => r.tutor_id))];
  let profiles = [], people = [], reviews = [];
  if (tutorIds.length) {
    const [p, u, r] = await Promise.all([
      _sb.from('tutor_profiles').select('user_id,hourly_rate,currency,is_active,university_verified_at,verified_university,location,avatar_url').in('user_id', tutorIds),
      _sb.from('public_tutors').select('id,full_name,avatar_url').in('id', tutorIds),
      _sb.from('reviews').select('tutor_id,rating').in('tutor_id', tutorIds),
    ]);
    profiles = p.data || []; people = u.data || []; reviews = r.data || [];
  }
  const peopleMap = Object.fromEntries(people.map(x => [x.id, x]));   // public_tutors leaves out suspended accounts
  const rv = {};
  reviews.forEach(r => { (rv[r.tutor_id] = rv[r.tutor_id] || { t: 0, n: 0 }); rv[r.tutor_id].t += r.rating; rv[r.tutor_id].n++; });

  // Same fair ranking as Find Tutors: rating blended with the platform average (worth 3 reviews),
  // stars only from 3 reviews, verified tutors first. Here a tutor from the student's own university comes before all of that.
  const allR = reviews.map(r => r.rating);
  const mean = allR.length ? allR.reduce((a, b) => a + b, 0) / allR.length : 4.5;
  const tutors = profiles
    .filter(tp => tp.is_active !== false && peopleMap[tp.user_id])
    .map(tp => {
      const courseRows = rows.filter(r => r.tutor_id === tp.user_id);
      const c = courseRows[0];
      const uni = c.university || tp.verified_university || tp.location || '';
      const s = rv[tp.user_id] || { t: 0, n: 0 };
      return { tp, c, uni, name: peopleMap[tp.user_id].full_name || T('tutor', 'Tutor'), avatar: tp.avatar_url || peopleMap[tp.user_id].avatar_url,
               mine: !!myUni && sameUni(uni, myUni), n: s.n, avg: s.n >= 3 ? (s.t / s.n).toFixed(1) : null, score: (3 * mean + s.t) / (3 + s.n) };
    })
    .sort((a, b) => (b.mine - a.mine) || ((b.tp.university_verified_at ? 1 : 0) - (a.tp.university_verified_at ? 1 : 0)) || (b.score - a.score) || (b.n - a.n));

  // Course label: the most common code, else the name, else what the feed or follows call it
  const pick = arr => { const m = {}; arr.filter(Boolean).map(s => String(s).trim()).filter(Boolean).forEach(s => m[s] = (m[s] || 0) + 1); return Object.entries(m).sort((a, b) => b[1] - a[1])[0]?.[0] || ''; };
  const posts = postsRes.data || [];
  label = pick(rows.map(r => r.course_code)) || pick(rows.map(r => r.course_name)) || pick(posts.map(p => p.course_code || p.subject)) || new URLSearchParams(location.search).get('c') || KEY;
  const name = pick(rows.map(r => r.course_name));
  const unis = [...new Set(rows.map(r => (r.university || '').trim()).filter(Boolean))];
  const stats = (statsRes.data && statsRes.data[0]) || { follower_count: 0, question_count: 0, i_follow: false };
  following = !!(me && stats.i_follow);

  const showName = name && name.toLowerCase() !== label.toLowerCase();
  if (NON_EN) setSeo(showName ? `${label} — ${name}` : label,
    tutors.length
      ? T('seo-tutors', { one: '{{count}} student tutor has passed {{course}}. Book a session or ask classmates a question.', other: '{{count}} student tutors have passed {{course}}. Book a session or ask classmates a question.' }, { count: tutors.length, course: label })
      : T('seo-empty', 'Questions and tutors for {{course}} on UniSkilled.', { course: label }));
  else setSeo(showName ? `${label} — ${name}` : label,
    tutors.length
      ? `${plural(tutors.length, 'student tutor has', 'student tutors have')} passed ${label}${unis.length ? ' at ' + unis.slice(0, 2).join(' and ') : ''}. Book a session or ask classmates a question.`
      : `Questions and tutors for ${label} on UniSkilled.`);
  if (!tutors.length) noindex();   // thin pages stay out of search results until a tutor adds the course

  const canBook = !me || myRole !== 'tutor';   // tutors only teach
  const tutorCard = t => {
    const initials = t.name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
    const rate = t.tp.hourly_rate ? `${__esc(currSymbol(t.tp.currency))}${__esc(t.tp.hourly_rate)} <span>${H('per-hour', '/ hour')}</span>` : '<span>' + H('rate-on-request', 'Rate on request') + '</span>';
    const passed = [t.uni ? T('passed-at', 'Passed at {{uni}}', { uni: t.uni }) : T('passed', 'Passed this course'), t.c.semester].filter(Boolean).join(' · ');
    const bookHref = me
      ? `book-session.html?tutor=${encodeURIComponent(t.tp.user_id)}&name=${encodeURIComponent(t.name)}&subject=${encodeURIComponent(t.c.course_name || t.c.course_code || label)}`
      : 'signin.html?redirect=' + encodeURIComponent(location.pathname + location.search);
    return `<article class="tutor">
      <div class="t-top">
        <div class="av">${t.avatar ? `<img src="${__safeUrl(t.avatar)}" alt="">` : __esc(initials)}</div>
        <div style="min-width:0">
          <a class="t-name" href="tutor-profile.html?id=${encodeURIComponent(t.tp.user_id)}">${__esc(t.name)}</a>
          <div class="t-meta">
            ${t.tp.university_verified_at ? '<span class="verified">✓ ' + H('verified', 'Verified') + '</span>' : ''}
            ${t.avg ? `<span>★ ${__esc(t.avg)} (${__esc(t.n)})</span>` : '<span>' + H('new-tutor', 'New tutor') + '</span>'}
            ${t.mine ? '<span class="same-uni">' + H('your-uni', 'Your university') + '</span>' : ''}
          </div>
        </div>
      </div>
      <div class="passed">${__esc(passed)}${t.c.grade ? `<br><span class="grade">${H('grade', 'Grade {{grade}}', { grade: t.c.grade })} <span>${H('self-reported', '(self-reported)')}</span></span>` : ''}</div>
      <div class="t-foot">
        <div class="rate">${rate}</div>
        ${canBook && t.tp.user_id !== me
          ? `<a class="btn primary" href="${__safeUrl(bookHref)}">${H('book', 'Book session')}</a>`
          : `<a class="btn ghost" href="tutor-profile.html?id=${encodeURIComponent(t.tp.user_id)}">${H('view-profile', 'View profile')}</a>`}
      </div>
    </article>`;
  };

  const askHref = 'feed.html?course=' + encodeURIComponent(label);
  const qCard = p => {
    const when = NON_EN ? I18N.date(new Date(p.created_at), { day: 'numeric', month: 'short' }) : new Date(p.created_at).toLocaleDateString([], { day: 'numeric', month: 'short' });
    return `<a class="q" href="${__safeUrl(askHref)}">
      <div class="q-text">${__esc(p.content)}</div>
      <div class="q-meta"><span>${__esc(p.author_name || T('student', 'Student'))}</span><span>${__esc(when)}</span>
        <span>${__esc(NON_EN ? T('replies', { one: '{{count}} reply', other: '{{count}} replies' }, { count: p.reply_count || 0 }) : plural(p.reply_count || 0, 'reply', 'replies'))}</span>${p.has_tutor_answer ? '<span class="answered">' + H('answered', 'Tutor answered') + '</span>' : ''}</div>
    </a>`;
  };

  box.innerHTML = `
    <section class="head" aria-labelledby="courseTitle">
      <div style="min-width:0;flex:1 1 320px">
        <h1 id="courseTitle">${__esc(label)}</h1>
        ${showName ? `<div class="sub">${__esc(name)}</div>` : ''}
        ${unis.length ? `<div class="unis">${__esc(unis.join(' · '))}</div>` : ''}
        <div class="stats">
          <span class="pill${tutors.length ? '' : ' muted'}">${__esc(NON_EN ? T('n-tutors', { one: '{{count}} tutor passed it', other: '{{count}} tutors passed it' }, { count: tutors.length }) : plural(tutors.length, 'tutor passed it', 'tutors passed it'))}</span>
          <span class="pill muted" id="followerPill">${__esc(NON_EN ? T('n-followers', { one: '{{count}} follower', other: '{{count}} followers' }, { count: Number(stats.follower_count) || 0 }) : plural(stats.follower_count, 'follower', 'followers'))}</span>
          ${stats.question_count ? `<span class="pill muted">${__esc(NON_EN ? T('n-questions', { one: '{{count}} question', other: '{{count}} questions' }, { count: Number(stats.question_count) || 0 }) : plural(stats.question_count, 'question', 'questions'))}</span>` : ''}
        </div>
      </div>
      <div class="actions">
        ${me ? `<button type="button" class="btn ghost" id="followBtn" aria-pressed="${following}" data-count="${Number(stats.follower_count) || 0}">${following ? H('following', 'Following') : H('follow', 'Follow course')}</button>` : `<a class="btn ghost" href="signin.html?redirect=${encodeURIComponent(location.pathname + location.search)}">${H('signin-follow', 'Sign in to follow')}</a>`}
        ${me && myRole !== 'tutor' ? `<a class="btn ghost" href="exam-planner.html?course=${encodeURIComponent(label)}">${H('plan-exam', 'Plan my exam')}</a>` : ''}
      </div>
      <div class="msg" id="followMsg" role="status" style="flex-basis:100%"></div>
    </section>

    <section class="section" aria-labelledby="tutorsHead">
      <h2 id="tutorsHead">${H('tutors-head', 'Tutors who passed this course')}</h2>
      <p class="hint">${myUni ? H('own-uni-first', 'Tutors from your university are shown first.') + ' ' : ''}${H('self-added', 'Courses and grades are added by tutors themselves.')}</p>
      ${tutors.length
        ? `<div class="tutors">${tutors.map(tutorCard).join('')}</div>`
        : `<div class="empty">${H('no-tutors', 'No tutor has added this course yet.')}${canBook ? `<br><a class="btn primary" href="find-tutors.html?q=${encodeURIComponent(label)}#request">${H('post-request', 'Post a request')}</a>` : ''}</div>`}
    </section>

    <section class="section" aria-labelledby="qHead">
      <h2 id="qHead">${H('q-head', 'Questions from classmates')}</h2>
      <p class="hint">${H('q-hint', 'Ask about this course in the Feed. Tutors who passed it can answer.')}</p>
      ${posts.length ? `<div class="qs">${posts.map(qCard).join('')}</div>` : '<div class="empty">' + H('no-questions', 'No questions yet.') + '</div>'}
      <div style="margin-top:.85rem"><a class="btn ghost" href="${__safeUrl(askHref)}">${H('ask', 'Ask a question')}</a></div>
    </section>`;

  const fb = document.getElementById('followBtn');
  if (fb) fb.addEventListener('click', toggleFollow);
  window.usTrack && usTrack('course_hub_view', { course: KEY, tutors: tutors.length });
}

async function toggleFollow() {
  const btn = document.getElementById('followBtn');
  const msg = document.getElementById('followMsg');
  btn.disabled = true; msg.textContent = '';
  const res = following
    ? await _sb.from('course_follows').delete().eq('user_id', me).eq('course_key', KEY)
    : await _sb.from('course_follows').insert({ user_id: me, course_code: label });
  btn.disabled = false;
  if (res.error) { msg.textContent = T('follow-failed', 'That didn’t work. Please try again.'); return; }
  following = !following;
  const n = Math.max(0, Number(btn.dataset.count) + (following ? 1 : -1));
  btn.dataset.count = n;
  btn.setAttribute('aria-pressed', following);
  btn.textContent = following ? T('following', 'Following') : T('follow', 'Follow course');
  document.getElementById('followerPill').textContent = NON_EN ? T('n-followers', { one: '{{count}} follower', other: '{{count}} followers' }, { count: n }) : plural(n, 'follower', 'followers');
  window.usTrack && usTrack(following ? 'course_follow' : 'course_unfollow', { course: KEY });
}

load().catch(() => {
  document.getElementById('content').innerHTML = '<div class="empty">' + H('load-failed', 'Could not load this course. Please refresh the page or try again in a moment.') + '</div>';
});
</script>
</body>
</html>
