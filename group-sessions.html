<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1a6bff;--ink:#0f172a;--mid:#64748b;--light:#94a3b8;--border:#e2e8f0;--off:#f8fafc;--green:#059669;--green-bg:#ecfdf5;}
body{font-family:'Manrope',sans-serif;background:#f8fafc;color:var(--ink);min-height:100vh;}
nav{height:62px;background:rgba(255,255,255,0.97);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:100;}
.page{max-width:900px;margin:0 auto;padding:2rem 5% 3rem;}
.page-head{margin-bottom:1.5rem;}
.page-title{font-size:1.5rem;font-weight:800;margin-bottom:0.4rem;}
.page-sub{font-size:0.88rem;color:var(--mid);}

.gs-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:1.3rem 1.5rem;margin-bottom:1rem;display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;}
.gs-icon{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#1a6bff,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;}
.gs-info{flex:1;min-width:200px;}
.gs-subject{font-size:1.05rem;font-weight:800;}
.gs-tutor{font-size:0.85rem;color:var(--mid);margin-top:2px;}
.gs-meta{font-size:0.8rem;color:var(--mid);margin-top:6px;display:flex;gap:1rem;flex-wrap:wrap;}
.gs-price{text-align:center;}
.gs-price-num{font-size:1.3rem;font-weight:800;color:var(--blue);}
.gs-price-lbl{font-size:0.7rem;color:var(--mid);}
.gs-spots{font-size:0.78rem;font-weight:700;color:var(--green);background:var(--green-bg);padding:0.3rem 0.7rem;border-radius:100px;}
.gs-spots.full{color:#b91c1c;background:#fee2e2;}
.join-btn{background:var(--blue);color:#fff;border:none;padding:0.65rem 1.4rem;border-radius:9px;font-family:'Manrope',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer;}
.join-btn:disabled{background:var(--light);cursor:not-allowed;}

.empty-state{text-align:center;padding:4rem 1rem;color:var(--mid);}
.spinner{width:28px;height:28px;border:3px solid rgba(26,107,255,0.2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:3rem auto;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="site.css">
<script src="ui.js"></script>
</head>
<body>
<header id="site-nav"></header>
<script src="site-nav.js"></script>

<main class="page" id="main">
  <div class="page-head">
    <div class="page-title">👥 Group Sessions</div>
    <div class="page-sub">Share one tutor with up to three classmates and split the cost. A session goes ahead once two students have paid.</div>
  </div>
  <div id="groupSessionsList" aria-live="polite"><div class="spinner"></div></div>
</main>

<script>
// ── XSS protection (security review Oct 2026) ──
function __esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/`/g,'&#96;');}
function __safeUrl(u){u=String(u==null?'':u).trim();if(!u)return '';if(/^(https?:)?\/\//i.test(u)||/^data:image\//i.test(u)||/^(?![a-z][a-z0-9+.-]*:)[^\s]*$/i.test(u))return __esc(u);return '#';}
function __jsStr(v){return __esc(JSON.stringify(String(v==null?'':v)).slice(1,-1).replace(/'/g,'\\x27'));}
function __viewerTz(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Berlin';}catch(e){return 'Europe/Berlin';}}
function __tzNote(tz){return (tz&&tz!==__viewerTz())?' ('+String(tz).split('/').pop().replace(/_/g,' ')+' time)':'';}
function __friendlyDbError(err, fallback){var m=(err&&err.message)||'';if(!m||/row-level security|permission denied|Not allowed|violates|JWT|fetch/i.test(m))return fallback;return m;}

const _sb = window.supabase.createClient(
  'https://orghkbbohnabcietidiv.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9yZ2hrYmJvaG5hYmNpZXRpZGl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMzcwMTMsImV4cCI6MjA5MjcxMzAxM30.3bOnZuga8a4xY4mbKdgLnw6EwAV5UuQDz26JI_vM-u8'
);

let currentUser = null;

async function init() {
  const { data: { session } } = await _sb.auth.getSession();
  currentUser = session ? session.user : null;   // guests can browse; joining asks them to sign in
  await loadGroupSessions();
}

const EMPTY_HTML = '<div class="empty-state">No open group sessions right now.<br>' +
  '<a href="find-tutors.html" style="color:var(--blue,#1a6bff);font-weight:700;text-decoration:none;">Book a one-to-one tutor instead</a>' +
  ' or ask a tutor in Messages to open a group for your course.</div>';

async function loadGroupSessions() {
  const list = document.getElementById('groupSessionsList');

  const { data: sessions } = await _sb.from('group_sessions')
    .select('*').eq('status', 'open').order('scheduled_date', { ascending: true });

  if (!sessions || sessions.length === 0) {
    list.innerHTML = EMPTY_HTML;
    return;
  }

  const ids = sessions.map(s => s.id);
  // Seat counts come from a summary view everyone can read (no student names).
  // The participant list itself is only needed — and only readable — when signed in.
  const { data: seatRows } = await _sb.from('group_session_seats').select('group_session_id,confirmed_count').in('group_session_id', ids);
  const seatMap = {}; (seatRows || []).forEach(r => { seatMap[r.group_session_id] = r.confirmed_count; });
  const { data: allParticipants } = currentUser
    ? await _sb.from('group_session_participants').select('id,group_session_id,student_id,status').in('group_session_id', ids).eq('student_id', currentUser.id)
    : { data: [] };

  // Only show future sessions with room left
  const now = new Date();
  const visible = sessions.filter(gs => {
    const dt = gs.starts_at ? new Date(gs.starts_at) : new Date(gs.scheduled_date + 'T' + gs.scheduled_time);
    return dt > now;
  });

  if (visible.length === 0) {
    list.innerHTML = EMPTY_HTML;
    return;
  }

  list.innerHTML = visible.map(gs => {
    const participants = (allParticipants || []).filter(p => p.group_session_id === gs.id);
    const confirmed = participants.filter(p => p.status === 'confirmed');
    const alreadyJoined = currentUser && participants.find(p => p.student_id === currentUser.id && (p.status === 'confirmed' || p.status === 'awaiting_payment'));
    const spotsLeft = gs.max_students - (seatMap[gs.id] ?? confirmed.length);
    const isFull = spotsLeft <= 0;
    const date = new Date(gs.scheduled_date).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });

    let btnHtml;
    if (alreadyJoined) {
      btnHtml = alreadyJoined.status === 'confirmed'
        ? `<span class="gs-spots">✓ You're in</span>`
        : `<a href="complete-payment.html?group_participant=${__safeUrl(alreadyJoined.id)}" class="join-btn" style="text-decoration:none;display:inline-block;">Complete Payment</a>`;
    } else if (isFull) {
      btnHtml = `<button class="join-btn" disabled>Full</button>`;
    } else {
      btnHtml = `<button class="join-btn" onclick="joinGroupSession('${gs.id}')">Join · ${__esc(gs.currency === 'USD' ? '$' : '€')}${__esc(gs.price_per_student)}</button>`;
    }

    return `<div class="gs-card">
      <div class="gs-icon">👥</div>
      <div class="gs-info">
        <div class="gs-subject">${__esc(gs.subject)}</div>
        <div class="gs-tutor">with ${__esc(gs.tutor_name || 'Tutor')}</div>
        <div class="gs-meta">
          <span>📅 ${__esc(date)} · ${__esc(gs.scheduled_time.slice(0,5) + __tzNote(gs.timezone))}</span>
          <span>⏱️ ${__esc(gs.duration_minutes)} min</span>
          <span>💻 ${__esc(gs.format === 'in-person' ? 'In-person' : 'Online')}</span>
        </div>
      </div>
      <span class="gs-spots ${__esc(isFull ? 'full' : '')}">${__esc(isFull ? 'Full' : spotsLeft + ' spot' + (spotsLeft === 1 ? '' : 's') + ' left')}</span>
      ${btnHtml}
    </div>`;
  }).join('');
}

async function joinGroupSession(groupSessionId) {
  if (!currentUser) { window.location.href = 'signin.html?redirect=' + encodeURIComponent('group-sessions.html'); return; }
  const { data: sp } = await _sb.from('users').select('full_name').eq('id', currentUser.id).maybeSingle();
  const studentName = sp?.full_name || 'Student';

  const { data: participant, error } = await _sb.from('group_session_participants').insert({
    group_session_id: groupSessionId,
    student_id: currentUser.id,
    student_name: studentName,
    status: 'awaiting_payment',
    payment_due_at: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString(),
  }).select().single();

  if (error) {
    if (error.code === '23505') {
      showToast("You've already joined this group session.", 'info');
    } else {
      showToast(__friendlyDbError(error, 'Could not join this session. Please try again.'), 'error');
    }
    return;
  }

  window.location.href = 'complete-payment.html?group_participant=' + participant.id;
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
