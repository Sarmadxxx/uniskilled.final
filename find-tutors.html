<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1a6bff;--ink:#111827;--mid:#6b7280;--light:#9ca3af;--border:#e5e7eb;--white:#fff;--off:#f9fafb;--green:#059669;--green-bg:#ecfdf5;--yellow:#f59e0b;}
body{font-family:'Manrope',sans-serif;background:var(--off);color:var(--ink);}
nav{position:sticky;top:0;z-index:100;height:60px;background:rgba(255,255,255,0.97);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 5%;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:1.1rem;color:var(--ink);}
.logo-icon{width:30px;height:30px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;}
.nav-links{display:flex;align-items:center;gap:0.5rem;}
.nav-link{font-size:0.83rem;font-weight:600;color:var(--mid);text-decoration:none;padding:0.4rem 0.7rem;border-radius:7px;}
.nav-link:hover{background:var(--off);color:var(--ink);}
.nav-cta{font-size:0.83rem;font-weight:700;background:var(--blue);color:#fff;text-decoration:none;padding:0.4rem 1rem;border-radius:8px;}
.nav-burger{display:none;background:none;border:none;font-size:1.4rem;cursor:pointer;}
.mobile-nav{display:none;position:fixed;top:60px;left:0;right:0;background:#fff;border-bottom:1px solid var(--border);z-index:99;padding:1rem;flex-direction:column;gap:0.5rem;}
body:not(.signed-in) .auth-only,body.signed-in .guest-only{display:none!important;}
.tutor-card{position:relative;}
.tutor-link{color:inherit;text-decoration:none;}
.tutor-link::after{content:"";position:absolute;inset:0;border-radius:16px;}
.tutor-link:focus-visible{outline:none;}
.tutor-card:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,107,255,.18);}
.book-btn{position:relative;z-index:1;white-space:nowrap;flex-shrink:0;}
.mobile-nav a{display:block;padding:0.7rem 1rem;font-weight:600;color:var(--ink);text-decoration:none;border-radius:8px;background:var(--off);}
.hero-search{background:linear-gradient(135deg,#0b1f4a,#1a6bff);padding:3rem 5%;text-align:center;}
.hero-search h1{font-size:2rem;font-weight:800;color:#fff;margin-bottom:0.5rem;}
.hero-search p{color:rgba(255,255,255,0.65);margin-bottom:1.5rem;}
.search-bar{display:flex;gap:0.7rem;max-width:580px;margin:0 auto;}
.search-input{flex:1;padding:0.9rem 1.2rem;border:none;border-radius:10px;font-family:'Manrope',sans-serif;font-size:0.95rem;outline:none;}
.search-btn{padding:0.9rem 1.6rem;background:#f7e049;color:var(--ink);border:none;border-radius:10px;font-family:'Manrope',sans-serif;font-weight:800;font-size:0.9rem;cursor:pointer;}
.post-req-btn{background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.3);color:#fff;font-family:'Manrope',sans-serif;font-weight:700;font-size:0.83rem;padding:0.6rem 1.2rem;border-radius:9px;cursor:pointer;backdrop-filter:blur(6px);transition:background .18s;}
.post-req-btn:hover{background:rgba(255,255,255,0.2);}
.req-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:600;display:none;align-items:center;justify-content:center;padding:1rem;}
.req-modal-overlay.open{display:flex;}
.req-modal{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:1.6rem;}
.req-modal-title{font-weight:800;font-size:1.1rem;margin-bottom:0.3rem;}
.req-modal-sub{font-size:0.85rem;color:var(--mid);line-height:1.5;margin-bottom:1.2rem;}
.req-form-group{margin-bottom:0.9rem;}
.req-form-label{display:block;font-size:0.8rem;font-weight:700;color:#374151;margin-bottom:0.35rem;}
.req-form-input{width:100%;padding:0.7rem 0.9rem;border:1.5px solid var(--border);border-radius:9px;font-family:'Manrope',sans-serif;font-size:0.87rem;outline:none;}
.req-form-input:focus{border-color:var(--blue);}
.req-form-row{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;}
.req-submit-btn{width:100%;padding:0.8rem;background:var(--blue);color:#fff;border:none;border-radius:9px;font-family:'Manrope',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;margin-top:0.4rem;}
.req-submit-btn:hover{background:#1558e0;}
.req-alert{padding:0.65rem 0.9rem;border-radius:8px;font-size:0.82rem;font-weight:600;margin-bottom:0.8rem;display:none;}
.req-alert.success{background:var(--green-bg);color:var(--green);display:block;}
.req-alert.error{background:#fef2f2;color:#dc2626;display:block;}
@media(max-width:480px){.req-form-row{grid-template-columns:1fr;}}
.filters{padding:1rem 5%;background:#fff;border-bottom:1px solid var(--border);display:flex;gap:0.7rem;flex-wrap:wrap;}
.filter-select{padding:0.5rem 0.85rem;border:1.5px solid var(--border);border-radius:8px;font-family:'Manrope',sans-serif;font-size:0.83rem;color:var(--ink);background:#fff;outline:none;cursor:pointer;}
.main{max-width:1100px;margin:0 auto;padding:2rem 5%;}
.results-count{font-size:0.85rem;color:var(--mid);font-weight:600;margin-bottom:1.2rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.2rem;}
.tutor-card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:1.5rem;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;}
.tutor-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,0.08);border-color:var(--blue);}
.card-top{display:flex;align-items:center;gap:1rem;margin-bottom:1rem;}
.tutor-av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#1a6bff,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;font-weight:800;flex-shrink:0;overflow:hidden;}
.tutor-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.tutor-name{font-weight:800;font-size:1rem;margin-bottom:2px;}
.tutor-uni{font-size:0.75rem;color:var(--mid);}
.stars{color:var(--yellow);font-size:0.8rem;}
.verified{display:inline-flex;align-items:center;gap:4px;background:var(--green-bg);color:var(--green);font-size:0.65rem;font-weight:700;padding:2px 7px;border-radius:100px;margin-top:3px;}
.subjects{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:0.9rem;}
.subject-tag{background:#e8f0ff;color:var(--blue);font-size:0.72rem;font-weight:600;padding:3px 9px;border-radius:100px;}
.card-footer{display:flex;justify-content:space-between;align-items:center;padding-top:0.9rem;border-top:1px solid var(--border);}
.tutor-rate{font-size:1.1rem;font-weight:800;}
.tutor-rate span{font-size:0.72rem;color:var(--mid);font-weight:400;}
.book-btn{background:var(--blue);color:#fff;border:none;padding:0.5rem 1.1rem;border-radius:8px;font-family:'Manrope',sans-serif;font-weight:700;font-size:0.8rem;cursor:pointer;}
.empty{text-align:center;padding:4rem 2rem;color:var(--mid);grid-column:1/-1;}
.loading-text{text-align:center;padding:3rem;color:var(--mid);grid-column:1/-1;}
@media(max-width:768px){.nav-links{display:none;}.nav-burger{display:block;}.search-bar{flex-direction:column;}.grid{grid-template-columns:1fr;}}
</style>

<script>
// ── XSS protection (security review Oct 2026) ──
function __esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/`/g,'&#96;');}
function __safeUrl(u){u=String(u==null?'':u).trim();if(!u)return '';if(/^(https?:)?\/\//i.test(u)||/^data:image\//i.test(u)||/^(?![a-z][a-z0-9+.-]*:)[^\s]*$/i.test(u))return __esc(u);return '#';}
function __jsStr(v){return __esc(JSON.stringify(String(v==null?'':v)).slice(1,-1).replace(/'/g,'\\x27'));}


const CURRENCY_SYMBOLS = {
  GBP:'£', EUR:'€', USD:'$', TRY:'₺', AED:'AED', SAR:'SAR',
  QAR:'QAR', KWD:'KWD', EGP:'EGP', MAD:'MAD', NGN:'₦', KES:'KSh',
  INR:'₹', CAD:'CA$', AUD:'A$', CHF:'CHF', SEK:'kr', NOK:'kr',
  DKK:'kr', PLN:'zł'
};
function currSymbol(code) { return CURRENCY_SYMBOLS[code] || code || '€'; }

const _sb = window.supabase.createClient(
  'https://orghkbbohnabcietidiv.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9yZ2hrYmJvaG5hYmNpZXRpZGl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMzcwMTMsImV4cCI6MjA5MjcxMzAxM30.3bOnZuga8a4xY4mbKdgLnw6EwAV5UuQDz26JI_vM-u8',
  { realtime: { params: { eventsPerSecond: 0 } }, global: { fetch: window.fetch.bind(window) } }
);

let allTutors = [];

async function loadTutors() {
  const grid = document.getElementById('tutorGrid');
  try {
    // Public columns only — payout details and meeting links are never needed here
    const { data: profiles } = await _sb.from('tutor_profiles').select('id,user_id,bio,subjects,teaching_levels,hourly_rate,currency,languages,format,location,teaching_style,video_link,rating_avg,review_count,sessions_count,university_verified_at,verified_university,grade_verified_at,certified_at,top_rated_at,next_available,is_active,created_at,session_length,availability,preferred_time,preferred_times,teaching_format,country,language,certificates,degree_level,major,overall_grade,max_students,avatar_url,study_year,cover_url');
    if (!profiles || profiles.length === 0) {
      grid.innerHTML = '<div class="empty"><div style="font-size:2.5rem;margin-bottom:1rem;">🎓</div><div style="font-weight:700;margin-bottom:0.5rem;">No tutors yet</div><p>Be the first to sign up as a tutor!</p></div>';
      document.getElementById('resultsCount').textContent = '0 tutors found';
      return;
    }

    const userIds = profiles.map(p => p.user_id).filter(Boolean);
    // public_tutors view: tutor names/photos readable by everyone, students' data never exposed
    const { data: users } = await _sb.from('public_tutors').select('id,full_name,avatar_url,country').in('id', userIds);
    const { data: reviews } = await _sb.from('reviews').select('tutor_id,rating');
    const { data: courseRows } = await _sb.from('tutor_courses').select('*').in('tutor_id', userIds);

    const userMap = {};
    (users || []).forEach(u => userMap[u.id] = u);
    const reviewMap = {};
    (reviews || []).forEach(r => {
      if (!reviewMap[r.tutor_id]) reviewMap[r.tutor_id] = { total: 0, count: 0 };
      reviewMap[r.tutor_id].total += r.rating;
      reviewMap[r.tutor_id].count++;
    });
    const courseMap = {};
    (courseRows || []).forEach(c => {
      if (!courseMap[c.tutor_id]) courseMap[c.tutor_id] = [];
      courseMap[c.tutor_id].push(c);
    });

    allTutors = profiles.map(tp => {
      const u = userMap[tp.user_id] || {};
      const rv = reviewMap[tp.user_id] || { total: 0, count: 0 };
      return { ...tp, fullName: u.full_name || 'Tutor', avatarUrl: tp.avatar_url || u.avatar_url || null, country: u.country || '', currency: tp.currency || 'GBP', avgRating: rv.count > 0 ? (rv.total / rv.count).toFixed(1) : null, reviewCount: rv.count, courses: courseMap[tp.user_id] || [] };
    });

    // Verified tutors first (nobody is hidden); original order otherwise
    allTutors.sort((a, b) => (b.university_verified_at ? 1 : 0) - (a.university_verified_at ? 1 : 0));
    renderTutors(allTutors);

    // Populate university filter from real tutor data (location field = their uni)
    const unis = [...new Set(allTutors.map(t => t.location).filter(Boolean))].sort();
    const uniSelect = document.getElementById('filterUniversity');
    unis.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u; opt.textContent = u;
      uniSelect.appendChild(opt);
    });

  } catch(e) {
    console.error(e);
    grid.innerHTML = '<div class="empty"><div style="font-size:2rem;margin-bottom:1rem;">⚠️</div><div style="font-weight:700;">Could not load tutors</div><p style="margin-top:0.5rem;">Please refresh the page or try again in a moment.</p></div>';
    document.getElementById('resultsCount').textContent = '';
  }
}

function renderTutors(tutors) {
  document.getElementById('resultsCount').textContent = tutors.length + ' tutor' + (tutors.length !== 1 ? 's' : '') + ' found';
  const grid = document.getElementById('tutorGrid');
  if (!tutors.length) {
    grid.innerHTML = '<div class="empty"><div style="font-size:2rem;margin-bottom:1rem;">🔍</div><div style="font-weight:700;">No tutors match</div><p>Try different filters</p></div>';
    return;
  }
  grid.innerHTML = tutors.map(t => {
    const initials = (t.fullName||'T').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
    const subjects = Array.isArray(t.subjects) ? t.subjects : [];
    const sym = currSymbol(t.currency);
    const rate = t.hourly_rate ? sym+t.hourly_rate : '';
    const stars = t.avgRating ? '★'.repeat(Math.round(t.avgRating))+'☆'.repeat(5-Math.round(t.avgRating)) : '';
    return `<article class="tutor-card">
      <div class="card-top">
        <div class="tutor-av">${t.avatarUrl?`<img src="${__safeUrl(t.avatarUrl)}" alt="${__esc(t.fullName)}">`:initials}</div>
        <div>
          <h2 class="tutor-name"><a class="tutor-link" href="tutor-profile.html?id=${encodeURIComponent(t.user_id)}">${__esc(t.fullName)}</a></h2>
          <div class="tutor-uni">${__esc(t.location||t.country||'')}</div>
          ${t.avgRating?`<div><span class="stars">${__esc(stars)}</span> <span style="font-size:0.72rem;color:var(--mid);">${__esc(t.avgRating)} (${__esc(t.reviewCount)})</span></div>`:''}
          ${t.university_verified_at ? `<div class="verified" title="University email verified${t.verified_university ? ' — ' + __esc(t.verified_university) : ''}">✓ Verified</div>` : ''}
        </div>
      </div>
      ${t.bio?`<p style="font-size:0.82rem;color:var(--mid);line-height:1.5;margin-bottom:0.9rem;">${__esc(t.bio.slice(0,120))}${__esc(t.bio.length>120?'...':'')}</p>`:''}
      ${(t.courses||[]).length > 0 ? `<div style="display:flex;flex-wrap:wrap;gap:0.35rem;margin-bottom:0.6rem;">${t.courses.slice(0,3).map(c=>`<span style="background:var(--blue-pale);color:var(--blue);font-size:0.72rem;font-weight:700;padding:3px 9px;border-radius:100px;">🎯 ${__esc(c.course_code)}</span>`).join('')}</div>` : ''}
      <div class="subjects">${subjects.slice(0,4).map(s=>`<span class="subject-tag">${__esc(s)}</span>`).join('')}</div>
      <div class="card-footer">
        <div class="tutor-rate">${rate ? `${__esc(rate)} <span>per hour</span>` : `<span style="font-size:0.8rem;">Rate on request</span>`}</div>
        <a class="book-btn" href="book-session.html?tutor=${encodeURIComponent(t.user_id)}&name=${encodeURIComponent(t.fullName)}" style="text-decoration:none;" aria-label="Book a session with ${__esc(t.fullName)}">Book session</a>
      </div>
    </article>`;
  }).join('');
}

function filterTutors() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  try { const u = new URL(location.href); q ? u.searchParams.set('q', q) : u.searchParams.delete('q'); history.replaceState(null, '', u); } catch (e) {}
  const fmt = document.getElementById('filterFormat').value;
  const price = document.getElementById('filterPrice').value;
  const day = document.getElementById('filterDay').value;
  const uniFilter = document.getElementById('filterUniversity').value;
  const countryFilter = document.getElementById('filterCountry').value;

  renderTutors(allTutors.filter(t => {
    const subjects = Array.isArray(t.subjects)?t.subjects:[];
    const avail = Array.isArray(t.availability)?t.availability:[];
    const courses = Array.isArray(t.courses)?t.courses:[];
    const matchesCourse = courses.some(c =>
      (c.course_code||'').toLowerCase().includes(q) ||
      (c.course_name||'').toLowerCase().includes(q) ||
      (c.professor_name||'').toLowerCase().includes(q)
    );
    if(q && !subjects.some(s=>s.toLowerCase().includes(q)) && !matchesCourse && !(t.fullName||'').toLowerCase().includes(q) && !(t.location||'').toLowerCase().includes(q)) return false;
    if(fmt && t.teaching_format!==fmt && t.teaching_format!=='both') return false;
    if(day && !avail.includes(day)) return false;
    if(price){const r=t.hourly_rate||0;if(price==='0-20'&&r>20)return false;if(price==='20-40'&&(r<20||r>40))return false;if(price==='40-60'&&(r<40||r>60))return false;if(price==='60+'&&r<60)return false;}
    if(uniFilter === 'same') {
      // Filter to tutors at the current student's university (set after login)
      if(!currentStudentUni || (t.location||'').toLowerCase() !== currentStudentUni.toLowerCase()) return false;
    } else if(uniFilter) {
      if((t.location||'') !== uniFilter) return false;
    }
    if(countryFilter && (t.country||'') !== countryFilter) return false;
    return true;
  }));
}


document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')filterTutors();});

let currentUserId = null;
let currentUserName = 'Student';
let currentUserRole = null;
let currentStudentUni = null;

async function setNav(){
  try {
    const {data:{session}} = await _sb.auth.getSession();
    if(!session){ document.body.classList.remove('signed-in'); }
    if(session){
      currentUserId = session.user.id;
      const meta = session.user.user_metadata||{};
      const role = meta.role||'student';
      currentUserRole = role;
      currentUserName = meta.full_name || 'Student';
      document.body.classList.add('signed-in');
      if(role!=='tutor'){
        // Only students can post subject requests
        document.getElementById('postRequestBanner').style.display = 'block';
        // Load student's university for "Same as mine" filter
        const {data:sp} = await _sb.from('student_profiles').select('university').eq('user_id', currentUserId).maybeSingle();
        if(sp?.university) currentStudentUni = sp.university;
      }
    }
  } catch(e){}
}

function openRequestModal(){
  if (!currentUserId) { window.location.href = 'signin.html'; return; }
  if (currentUserRole === 'tutor') return; // safety guard, button is hidden anyway
  document.getElementById('reqAlert').style.display = 'none';
  document.getElementById('requestModal').classList.add('open');
}
function closeRequestModal(){
  document.getElementById('requestModal').classList.remove('open');
}
window.submitRequest = async function(){
  const subject = document.getElementById('reqSubject').value.trim();
  if (!subject) {
    const a = document.getElementById('reqAlert');
    a.textContent = 'Please enter a subject.'; a.className = 'req-alert error';
    return;
  }
  const btn = document.getElementById('reqSubmitBtn');
  btn.disabled = true; btn.textContent = 'Posting...';
  const { error } = await _sb.from('subject_requests').insert({
    student_id: currentUserId,
    student_name: currentUserName,
    subject,
    notes: document.getElementById('reqNotes').value.trim() || null,
    level: document.getElementById('reqLevel').value || null,
    frequency: document.getElementById('reqFrequency').value || null,
    language: document.getElementById('reqLanguage').value.trim() || null,
    status: 'open'
  });
  btn.disabled = false; btn.textContent = 'Post request →';
  const a = document.getElementById('reqAlert');
  if (error) {
    a.textContent = 'Error: ' + error.message; a.className = 'req-alert error';
    return;
  }
  a.textContent = 'Request posted! Tutors who can help will reach out.'; a.className = 'req-alert success';
  document.getElementById('reqSubject').value = '';
  document.getElementById('reqNotes').value = '';
  document.getElementById('reqLevel').value = '';
  document.getElementById('reqFrequency').value = '';
  document.getElementById('reqLanguage').value = '';
  setTimeout(closeRequestModal, 1400);
};

document.addEventListener('DOMContentLoaded',async ()=>{
  const q0 = new URLSearchParams(location.search).get('q');
  if (q0) document.getElementById('searchInput').value = q0;
  loadTutors().then(() => { if (q0) filterTutors(); });
  await setNav();
  if (window.location.hash === '#request') {
    setTimeout(openRequestModal, 300); // small delay so currentUserId/role are set after setNav resolves
  }
});
</script>
