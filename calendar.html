<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — UniSkilled</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1a6bff;--ink:#0f172a;--ink2:#334155;--mid:#64748b;--light:#94a3b8;--border:#e2e8f0;--white:#fff;--off:#f8fafc;--green:#059669;--green-bg:#ecfdf5;--red:#dc2626;--yellow:#f59e0b;}
body{font-family:'Manrope',sans-serif;background:#f1f5f9;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;}
nav{height:62px;background:rgba(255,255,255,0.97);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:100;flex-shrink:0;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:1.1rem;color:var(--ink);}
.logo-icon{width:32px;height:32px;background:var(--blue);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:0.9rem;}
.nav-link{font-size:0.83rem;font-weight:600;color:var(--mid);text-decoration:none;padding:0.45rem 0.8rem;border-radius:8px;}
.nav-link:hover{background:var(--off);color:var(--ink);}

.page{max-width:1100px;margin:0 auto;width:100%;padding:1.8rem 5% 3rem;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.3rem;flex-wrap:wrap;gap:1rem;}
.cal-title{font-size:1.5rem;font-weight:800;}
.cal-nav{display:flex;align-items:center;gap:0.6rem;}
.cal-nav-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink2);}
.cal-nav-btn:hover{background:var(--off);}
.cal-today-btn{font-size:0.8rem;font-weight:700;color:var(--blue);background:var(--off);border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.8rem;cursor:pointer;}

.cal-legend{display:flex;gap:1.1rem;flex-wrap:wrap;margin-bottom:1.1rem;font-size:0.76rem;color:var(--mid);}
.legend-item{display:flex;align-items:center;gap:0.4rem;}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

.cal-grid{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);}
.cal-weekday{padding:0.7rem 0;text-align:center;font-size:0.72rem;font-weight:700;color:var(--light);text-transform:uppercase;letter-spacing:0.04em;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-day{min-height:92px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:0.5rem;cursor:pointer;transition:background .12s;position:relative;}
.cal-day:nth-child(7n){border-right:none;}
.cal-day:hover{background:var(--off);}
.cal-day.other-month{background:#fafbfc;color:var(--light);}
.cal-day.today .day-num{background:var(--blue);color:#fff;}
.cal-day.selected{background:#eff6ff;box-shadow:inset 0 0 0 2px var(--blue);}
.day-num{font-size:0.82rem;font-weight:700;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:0.35rem;}
.day-dots{display:flex;gap:3px;flex-wrap:wrap;}
.day-dot{width:6px;height:6px;border-radius:50%;}
.day-more{font-size:0.66rem;color:var(--mid);font-weight:600;margin-top:2px;}

.dot-pending{background:#ea580c;}
.dot-awaiting-payment{background:var(--yellow);}
.dot-confirmed{background:var(--green);}
.dot-completed{background:var(--light);}
.dot-expired{background:var(--red);}

.day-panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:1.3rem;margin-top:1.3rem;}
.day-panel-title{font-size:1rem;font-weight:800;margin-bottom:1rem;}
.session-item{display:flex;align-items:center;gap:0.9rem;padding:0.8rem 0;border-bottom:1px solid var(--off);}
.session-item:last-child{border-bottom:none;}
.session-av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1a6bff,#7c3aed);color:#fff;font-weight:800;font-size:0.85rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.session-details{flex:1;min-width:0;}
.session-name{font-weight:700;font-size:0.9rem;}
.session-meta{font-size:0.78rem;color:var(--mid);margin-top:2px;}
.badge{font-size:0.68rem;font-weight:700;padding:3px 9px;border-radius:100px;white-space:nowrap;}
.badge-pending{background:#fff7ed;color:#ea580c;}
.badge-confirmed{background:var(--green-bg);color:var(--green);}
.badge-completed{background:var(--off);color:var(--mid);}
.badge-awaiting-payment{background:#fef3c7;color:#92400e;}
.badge-expired{background:#fee2e2;color:#b91c1c;}
.empty-state{text-align:center;padding:2rem 1rem;color:var(--mid);}
.empty-icon{font-size:1.8rem;margin-bottom:0.5rem;}
.spinner{width:28px;height:28px;border:3px solid rgba(26,107,255,0.2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:2rem auto;}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:640px){
  .cal-day{min-height:64px;padding:0.35rem;}
  .day-num{width:20px;height:20px;font-size:0.75rem;}
  .cal-title{font-size:1.2rem;}
}
</style>
</head>
<body>
<nav>
  <div id="nav-root"></div>
</nav>
<script src="nav.js"></script>

<div class="page">
  <div class="cal-header">
    <div class="cal-title" id="monthTitle">—</div>
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
      <button class="cal-today-btn" onclick="goToToday()">Today</button>
      <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <div class="cal-legend">
    <div class="legend-item"><span class="legend-dot dot-pending"></span>Pending</div>
    <div class="legend-item"><span class="legend-dot dot-awaiting-payment"></span>Awaiting payment</div>
    <div class="legend-item"><span class="legend-dot dot-confirmed"></span>Confirmed</div>
    <div class="legend-item"><span class="legend-dot dot-completed"></span>Completed</div>
    <div class="legend-item"><span class="legend-dot dot-expired"></span>Expired</div>
  </div>

  <div id="calGrid" class="cal-grid">
    <div class="spinner"></div>
  </div>

  <div class="day-panel" id="dayPanel" style="display:none;">
    <div class="day-panel-title" id="dayPanelTitle">—</div>
    <div id="dayPanelBody"></div>
  </div>
</div>

<script>
const _sb = window.supabase.createClient(
  'https://orghkbbohnabcietidiv.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9yZ2hrYmJvaG5hYmNpZXRpZGl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMzcwMTMsImV4cCI6MjA5MjcxMzAxM30.3bOnZuga8a4xY4mbKdgLnw6EwAV5UuQDz26JI_vM-u8'
);

let currentUser = null;
let userRole = 'student';
let viewYear, viewMonth; // viewMonth is 0-indexed
let sessionsByDate = {}; // 'YYYY-MM-DD' -> [session, ...]
let selectedDateKey = null;

function dateKey(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

function badgeInfoFor(status) {
  if (status === 'awaiting_payment') return { cls: 'awaiting-payment', label: 'awaiting payment' };
  if (status === 'payment_expired') return { cls: 'expired', label: 'expired' };
  if (status === 'confirmed') return { cls: 'confirmed', label: 'confirmed' };
  if (status === 'completed') return { cls: 'completed', label: 'completed' };
  return { cls: 'pending', label: status || 'pending' };
}

async function init() {
  const { data: { session } } = await _sb.auth.getSession();
  if (!session) { window.location.href = 'signin.html?redirect=' + encodeURIComponent(window.location.href); return; }
  currentUser = session.user;
  const meta = currentUser.user_metadata || {};
  userRole = meta.role === 'tutor' ? 'tutor' : 'student';
  renderSimpleNav(userRole === 'tutor' ? 'tutor-dashboard.html' : 'student-dashboard.html');

  const today = new Date();
  viewYear = today.getFullYear();
  viewMonth = today.getMonth();

  await loadSessions();
  render();
}

async function loadSessions() {
  const column = userRole === 'tutor' ? 'tutor_id' : 'student_id';
  const { data, error } = await _sb.from('sessions')
    .select('*')
    .eq(column, currentUser.id)
    .not('scheduled_date', 'is', null);

  sessionsByDate = {};
  if (error || !data) return;

  data.forEach(s => {
    if (!s.scheduled_date) return;
    const key = s.scheduled_date.slice(0, 10); // handles both date and timestamp strings
    if (!sessionsByDate[key]) sessionsByDate[key] = [];
    sessionsByDate[key].push(s);
  });
}

function changeMonth(delta) {
  viewMonth += delta;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  render();
}

function goToToday() {
  const today = new Date();
  viewYear = today.getFullYear();
  viewMonth = today.getMonth();
  render();
  const key = dateKey(viewYear, viewMonth, today.getDate());
  selectDay(key, today.getDate(), true);
}

function render() {
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('monthTitle').textContent = `${monthNames[viewMonth]} ${viewYear}`;

  const firstDay = new Date(viewYear, viewMonth, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);

  let cells = '';
  // Leading days from previous month
  for (let i = firstDay - 1; i >= 0; i--) {
    cells += `<div class="cal-day other-month"><div class="day-num">${daysInPrevMonth - i}</div></div>`;
  }
  // Days of current month
  for (let d = 1; d <= daysInMonth; d++) {
    const key = dateKey(viewYear, viewMonth, d);
    const isToday = key === todayStr;
    const daySessions = sessionsByDate[key] || [];
    const dots = daySessions.slice(0, 4).map(s => `<span class="day-dot dot-${badgeInfoFor(s.status).cls}"></span>`).join('');
    const more = daySessions.length > 4 ? `<div class="day-more">+${daySessions.length - 4}</div>` : '';
    cells += `<div class="cal-day ${isToday ? 'today' : ''} ${key === selectedDateKey ? 'selected' : ''}" onclick="selectDay('${key}', ${d})">
      <div class="day-num">${d}</div>
      <div class="day-dots">${dots}</div>
      ${more}
    </div>`;
  }
  // Trailing days from next month to complete the grid
  const totalCells = firstDay + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let d = 1; d <= trailing; d++) {
    cells += `<div class="cal-day other-month"><div class="day-num">${d}</div></div>`;
  }

  document.getElementById('calGrid').innerHTML = `
    <div class="cal-weekdays">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(w => `<div class="cal-weekday">${w}</div>`).join('')}
    </div>
    <div class="cal-days">${cells}</div>
  `;
}

function selectDay(key, dayNum, skipRerender) {
  selectedDateKey = key;
  if (!skipRerender) render();

  const daySessions = sessionsByDate[key] || [];
  const panel = document.getElementById('dayPanel');
  const dateObj = new Date(key + 'T00:00:00');
  document.getElementById('dayPanelTitle').textContent = dateObj.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });

  if (daySessions.length === 0) {
    document.getElementById('dayPanelBody').innerHTML = `<div class="empty-state"><div class="empty-icon">📅</div>No sessions on this day.</div>`;
  } else {
    document.getElementById('dayPanelBody').innerHTML = daySessions
      .sort((a, b) => (a.scheduled_time || '').localeCompare(b.scheduled_time || ''))
      .map(s => {
        const otherName = userRole === 'tutor' ? (s.student_name || 'Student') : (s.tutor_name || 'Tutor');
        const initials = otherName.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
        const info = badgeInfoFor(s.status);
        const time = s.scheduled_time ? s.scheduled_time.slice(0, 5) : '';
        let action = '';
        if (s.status === 'confirmed') {
          action = `<a href="${userRole === 'tutor' ? 'tutor-dashboard.html' : 'student-dashboard.html'}" style="font-size:0.78rem;font-weight:700;color:var(--blue);text-decoration:none;">Go to session →</a>`;
        } else if (s.status === 'awaiting_payment' && userRole === 'student') {
          action = `<a href="complete-payment.html?session=${s.id}" style="font-size:0.78rem;font-weight:700;color:var(--blue);text-decoration:none;">Pay now →</a>`;
        }
        return `<div class="session-item">
          <div class="session-av">${initials}</div>
          <div class="session-details">
            <div class="session-name">${otherName}</div>
            <div class="session-meta">${s.subject || ''} ${time ? '· ' + time : ''}</div>
          </div>
          <span class="badge badge-${info.cls}">${info.label}</span>
          ${action}
        </div>`;
      }).join('');
  }

  panel.style.display = 'block';
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
