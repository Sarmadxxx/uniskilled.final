# Supabase CLI settings for this project.
# verify_jwt mirrors each LIVE function exactly (checked 2026-10-21). Functions with verify_jwt = false
# check the caller themselves (login token, Stripe signature, cron secret or service key).
# The CLI defaults to true, so a function missing here would change behaviour when deployed —
# tests/static_checks.py fails the build if any function folder has no entry.
