<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Console — UniSkilled</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1a6bff;--navy:#0b1f4a;--ink:#0f172a;--ink2:#334155;--mid:#64748b;--light:#94a3b8;--border:#e2e8f0;--off:#f8fafc;--white:#fff;--green:#059669;--green-bg:#ecfdf5;--red:#dc2626;--red-bg:#fef2f2;--amber:#92400e;--amber-bg:#fffbeb;}
body{font-family:'Manrope',sans-serif;background:#f1f5f9;color:var(--ink);min-height:100vh;}

/* ── AUTH SCREEN ── */
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:linear-gradient(135deg,var(--navy),var(--blue));}
.auth-box{background:#fff;border-radius:16px;padding:2.2rem;max-width:380px;width:100%;text-align:center;}
.auth-logo{height:38px;margin-bottom:1.2rem;}
.auth-title{font-size:1.2rem;font-weight:800;margin-bottom:0.3rem;}
.auth-sub{font-size:0.82rem;color:var(--mid);margin-bottom:1.4rem;}
.auth-input{width:100%;padding:0.7rem 0.9rem;border:1.5px solid var(--border);border-radius:9px;font-family:'Manrope',sans-serif;font-size:0.88rem;margin-bottom:0.8rem;}
.auth-btn{width:100%;background:var(--blue);color:#fff;border:none;padding:0.75rem;border-radius:9px;font-family:'Manrope',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;}
.auth-error{color:var(--red);font-size:0.8rem;margin-top:0.8rem;display:none;}
.access-denied{text-align:center;padding:5rem 1rem;color:var(--mid);}

/* ── SHELL ── */
#adminShell{display:none;}
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;position:sticky;top:0;z-index:200;}
.topbar-logo{display:flex;align-items:center;gap:8px;}
.topbar-logo img{height:30px;}
.topbar-title{font-size:0.85rem;font-weight:700;color:var(--mid);}
.topbar-right{display:flex;align-items:center;gap:0.8rem;}
.notif-bell{position:relative;background:none;border:none;font-size:1.2rem;cursor:pointer;padding:0.3rem;}
.notif-badge{position:absolute;top:0;right:0;background:var(--red);color:#fff;font-size:0.6rem;font-weight:800;padding:1px 5px;border-radius:100px;min-width:15px;text-align:center;}
.signout-btn{font-size:0.78rem;color:var(--mid);background:none;border:1px solid var(--border);padding:0.4rem 0.8rem;border-radius:7px;cursor:pointer;}
.mobile-menu-btn{display:none;background:none;border:none;font-size:1.3rem;cursor:pointer;}

.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 60px);}
.sidebar{background:#fff;border-right:1px solid var(--border);padding:1rem 0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:0.7rem 1.2rem;font-size:0.85rem;font-weight:600;color:var(--ink2);cursor:pointer;border-left:3px solid transparent;}
.nav-item:hover{background:var(--off);}
.nav-item.active{background:#eff6ff;color:var(--blue);border-left-color:var(--blue);}
.nav-item .count{margin-left:auto;background:var(--red);color:#fff;font-size:0.65rem;font-weight:800;padding:1px 6px;border-radius:100px;}

.main{padding:1.5rem;overflow-x:hidden;}
.page-title{font-size:1.3rem;font-weight:800;margin-bottom:1.2rem;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0.9rem;margin-bottom:1.5rem;}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1.1rem;}
.stat-num{font-size:1.5rem;font-weight:800;color:var(--ink);}
.stat-lbl{font-size:0.72rem;color:var(--mid);text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;}

.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:1.2rem 1.4rem;margin-bottom:1.2rem;}
.card-title{font-size:0.95rem;font-weight:800;margin-bottom:0.9rem;}

table{width:100%;border-collapse:collapse;font-size:0.82rem;}
th{text-align:left;padding:0.5rem 0.6rem;color:var(--light);font-size:0.68rem;text-transform:uppercase;font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:0.6rem;border-bottom:1px solid var(--off);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-scroll{overflow-x:auto;}

.badge{font-size:0.68rem;font-weight:700;padding:2px 9px;border-radius:100px;white-space:nowrap;}
.badge-green{background:var(--green-bg);color:var(--green);}
.badge-red{background:var(--red-bg);color:var(--red);}
.badge-amber{background:var(--amber-bg);color:var(--amber);}
.badge-gray{background:var(--off);color:var(--mid);}

.filter-row{display:flex;gap:0.6rem;margin-bottom:1rem;flex-wrap:wrap;}
.filter-btn{padding:0.4rem 0.9rem;border-radius:100px;font-size:0.78rem;font-weight:600;border:1.5px solid var(--border);background:#fff;color:var(--mid);cursor:pointer;}
.filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.search-input{padding:0.5rem 0.8rem;border:1.5px solid var(--border);border-radius:9px;font-family:'Manrope',sans-serif;font-size:0.82rem;flex:1;min-width:180px;}

.dispute-card{border:1px solid var(--border);border-radius:12px;padding:1.1rem;margin-bottom:0.9rem;}
.dispute-reason{background:var(--off);border-radius:8px;padding:0.8rem 0.9rem;font-size:0.83rem;margin:0.7rem 0;}
.resolve-row{display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;}
.resolve-btn{padding:0.5rem 0.9rem;border-radius:8px;font-size:0.78rem;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:#fff;}
.resolve-btn.release{color:var(--green);border-color:#86efac;}
.resolve-btn.refund{color:var(--red);border-color:#fecaca;}
.resolve-btn.partial{color:var(--amber);border-color:#fcd34d;}
.notes-input{flex:1;min-width:160px;padding:0.5rem 0.7rem;border:1.5px solid var(--border);border-radius:8px;font-family:'Manrope',sans-serif;font-size:0.8rem;}
.partial-amount-input{width:85px;padding:0.5rem;border:1.5px solid var(--border);border-radius:8px;font-family:'Manrope',sans-serif;font-size:0.8rem;display:none;}

.empty-state{text-align:center;padding:3rem 1rem;color:var(--mid);font-size:0.85rem;}
.spinner{width:26px;height:26px;border:3px solid rgba(26,107,255,0.2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:2.5rem auto;}
@keyframes spin{to{transform:rotate(360deg)}}

.suspend-btn{font-size:0.72rem;color:var(--red);background:none;border:1px solid #fecaca;padding:3px 8px;border-radius:6px;cursor:pointer;}
.unsuspend-btn{font-size:0.72rem;color:var(--green);background:none;border:1px solid #86efac;padding:3px 8px;border-radius:6px;cursor:pointer;}

.notif-panel{position:fixed;top:60px;right:0;width:340px;max-width:90vw;height:calc(100vh - 60px);background:#fff;border-left:1px solid var(--border);z-index:300;display:none;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,0.08);}
.notif-panel.open{display:flex;}
.notif-panel-head{padding:1rem 1.2rem;border-bottom:1px solid var(--border);font-weight:800;display:flex;justify-content:space-between;align-items:center;}
.notif-panel-body{flex:1;overflow-y:auto;}
.notif-row{padding:0.9rem 1.2rem;border-bottom:1px solid var(--off);font-size:0.8rem;cursor:pointer;}
.notif-row.unread{background:#eff6ff;}
.notif-row-title{font-weight:700;margin-bottom:2px;}
.notif-row-body{color:var(--mid);}
.notif-row-time{color:var(--light);font-size:0.7rem;margin-top:4px;}

@media(max-width:800px){
  .layout{grid-template-columns:1fr;}
  .sidebar{display:none;position:fixed;top:60px;left:0;right:0;bottom:0;z-index:250;overflow-y:auto;}
  .sidebar.open{display:block;}
  .mobile-menu-btn{display:block;}
  .main{padding:1rem;}
  .topbar-title{display:none;}
}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen">
  <div class="auth-box">
    <img src="uniskilled-logo.png" alt="UniSkilled" class="auth-logo">
    <div class="auth-title">Admin Console</div>
    <div class="auth-sub">Sign in with your admin account</div>
    <input type="email" id="authEmail" class="auth-input" placeholder="Email">
    <input type="password" id="authPassword" class="auth-input" placeholder="Password">
    <button class="auth-btn" onclick="doSignIn()" id="signInBtn">Sign In</button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<!-- ACCESS DENIED (signed in but not admin) -->
<div id="deniedScreen" style="display:none;" class="access-denied">🔒 This account doesn't have admin access.</div>

<!-- ADMIN SHELL -->
<div id="adminShell">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:0.8rem;">
      <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="topbar-logo"><img src="uniskilled-logo.png" alt="UniSkilled"></div>
      <span class="topbar-title">Admin Console</span>
    </div>
    <div class="topbar-right">
      <button class="notif-bell" onclick="toggleNotifPanel()">
        🔔<span class="notif-badge" id="notifBadge" style="display:none;">0</span>
      </button>
      <button class="signout-btn" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div class="nav-item active" onclick="showPage('overview',this)">📊 Overview</div>
      <div class="nav-item" onclick="showPage('disputes',this)">🚨 Disputes<span class="count" id="disputeCount" style="display:none;">0</span></div>
      <div class="nav-item" onclick="showPage('transactions',this)">💰 Transactions</div>
      <div class="nav-item" onclick="showPage('sessions',this)">📅 Sessions</div>
      <div class="nav-item" onclick="showPage('groupsessions',this)">👥 Group Sessions</div>
      <div class="nav-item" onclick="showPage('users',this)">👤 Users</div>
    </div>

    <div class="main">
      <!-- OVERVIEW -->
      <div id="page-overview">
        <div class="page-title">📊 Overview</div>
        <div class="stat-grid" id="statsGrid"><div class="spinner"></div></div>
        <div class="card">
          <div class="card-title">Recent Activity</div>
          <div id="recentActivity"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- DISPUTES -->
      <div id="page-disputes" style="display:none;">
        <div class="page-title">🚨 Disputes</div>
        <div class="filter-row">
          <button class="filter-btn active" onclick="setDisputeFilter('open',this)">Open</button>
          <button class="filter-btn" onclick="setDisputeFilter('resolved',this)">Resolved</button>
        </div>
        <div id="disputesList"><div class="spinner"></div></div>
      </div>

      <!-- TRANSACTIONS -->
      <div id="page-transactions" style="display:none;">
        <div class="page-title">💰 Transactions</div>
        <div class="filter-row">
          <button class="filter-btn active" onclick="setTxnFilter('all',this)">All</button>
          <button class="filter-btn" onclick="setTxnFilter('paid',this)">Paid</button>
          <button class="filter-btn" onclick="setTxnFilter('released',this)">Released</button>
          <button class="filter-btn" onclick="setTxnFilter('refunded',this)">Refunded</button>
        </div>
        <div class="card">
          <div class="table-scroll" id="transactionsTable"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- SESSIONS -->
      <div id="page-sessions" style="display:none;">
        <div class="page-title">📅 Sessions</div>
        <div class="filter-row">
          <button class="filter-btn active" onclick="setSessionFilter('all',this)">All</button>
          <button class="filter-btn" onclick="setSessionFilter('pending',this)">Pending</button>
          <button class="filter-btn" onclick="setSessionFilter('awaiting_payment',this)">Awaiting Payment</button>
          <button class="filter-btn" onclick="setSessionFilter('confirmed',this)">Confirmed</button>
          <button class="filter-btn" onclick="setSessionFilter('completed',this)">Completed</button>
          <button class="filter-btn" onclick="setSessionFilter('cancelled',this)">Cancelled</button>
        </div>
        <div class="card">
          <div class="table-scroll" id="sessionsTable"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- GROUP SESSIONS -->
      <div id="page-groupsessions" style="display:none;">
        <div class="page-title">👥 Group Sessions</div>
        <div class="card">
          <div class="table-scroll" id="groupSessionsTable"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- USERS -->
      <div id="page-users" style="display:none;">
        <div class="page-title">👤 Users</div>
        <div class="filter-row">
          <input type="text" class="search-input" id="userSearch" placeholder="Search by name or email..." oninput="renderUsers()">
          <button class="filter-btn active" onclick="setUserFilter('all',this)">All</button>
          <button class="filter-btn" onclick="setUserFilter('tutor',this)">Tutors</button>
          <button class="filter-btn" onclick="setUserFilter('student',this)">Students</button>
          <button class="filter-btn" onclick="setUserFilter('suspended',this)">Suspended</button>
        </div>
        <div class="card">
          <div class="table-scroll" id="usersTable"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- NOTIFICATION PANEL -->
<div class="notif-panel" id="notifPanel">
  <div class="notif-panel-head">
    <span>Notifications</span>
    <button onclick="toggleNotifPanel()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;">×</button>
  </div>
  <div class="notif-panel-body" id="notifPanelBody"><div class="spinner"></div></div>
</div>

<script>
const SUPABASE_URL = 'https://orghkbbohnabcietidiv.supabase.co';
const _sb = window.supabase.createClient(
  SUPABASE_URL,
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9yZ2hrYmJvaG5hYmNpZXRpZGl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMzcwMTMsImV4cCI6MjA5MjcxMzAxM30.3bOnZuga8a4xY4mbKdgLnw6EwAV5UuQDz26JI_vM-u8'
);

let adminUser = null;
let allUsers = [], allSessions = [], allGroupSessions = [], allPayments = [], allDisputes = [];
let disputeFilter = 'open', txnFilter = 'all', sessionFilter = 'all', userFilter = 'all';

async function doSignIn() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errBox = document.getElementById('authError');
  errBox.style.display = 'none';

  if (!email || !password) {
    errBox.textContent = 'Please enter both email and password.';
    errBox.style.display = 'block';
    return;
  }

  const btn = document.getElementById('signInBtn');
  btn.disabled = true;
  btn.textContent = 'Signing in...';

  const { data, error } = await _sb.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  btn.textContent = 'Sign In';

  if (error) {
    errBox.textContent = error.message;
    errBox.style.display = 'block';
    return;
  }

  await checkAdminAccess();
}

async function checkAdminAccess() {
  const { data: { session } } = await _sb.auth.getSession();
  if (!session) return; // stay on auth screen

  const { data: u } = await _sb.from('users').select('*').eq('id', session.user.id).single();
  if (!u?.roles?.includes('admin')) {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('deniedScreen').style.display = 'block';
    return;
  }

  adminUser = { id: session.user.id, email: u.email };
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('deniedScreen').style.display = 'none';
  document.getElementById('adminShell').style.display = 'block';

  await loadEverything();
  setupRealtime();
}

async function signOut() {
  await _sb.auth.signOut();
  location.reload();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function showPage(id, el) {
  document.querySelectorAll('[id^="page-"]').forEach(p => p.style.display = 'none');
  document.getElementById('page-' + id).style.display = 'block';
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
}

// ── DATA LOADING ──
async function loadEverything() {
  const [usersRes, sessionsRes, groupSessionsRes, paymentsRes, disputesRes] = await Promise.all([
    _sb.from('users').select('*').order('created_at', { ascending: false }),
    _sb.from('sessions').select('*').order('created_at', { ascending: false }).limit(200),
    _sb.from('group_sessions').select('*, group_session_participants(*)').order('created_at', { ascending: false }),
    _sb.from('payments').select('*').order('paid_at', { ascending: false }).limit(200),
    _sb.from('disputes').select('*, sessions(*)').order('created_at', { ascending: false }),
  ]);

  allUsers = usersRes.data || [];
  allSessions = sessionsRes.data || [];
  allGroupSessions = groupSessionsRes.data || [];
  allPayments = paymentsRes.data || [];
  allDisputes = disputesRes.data || [];

  renderOverview();
  renderDisputes();
  renderTransactions();
  renderSessions();
  renderGroupSessions();
  renderUsers();
  await loadNotifications();

  const openCount = allDisputes.filter(d => d.status === 'open').length;
  const dc = document.getElementById('disputeCount');
  if (openCount > 0) { dc.textContent = openCount; dc.style.display = 'inline-block'; }
  else dc.style.display = 'none';
}

function setupRealtime() {
  _sb.channel('admin-notifs')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${adminUser.id}` },
      async () => await loadEverything())
    .subscribe();
  _sb.channel('admin-disputes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'disputes' },
      async () => await loadEverything())
    .subscribe();
  _sb.channel('admin-payments')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'payments' },
      async () => await loadEverything())
    .subscribe();
}

// ── OVERVIEW ──
function renderOverview() {
  const totalStudents = allUsers.filter(u => u.roles?.includes('student')).length;
  const totalTutors = allUsers.filter(u => u.roles?.includes('tutor')).length;
  const totalRevenue = allPayments.filter(p => p.status === 'paid' || p.status === 'released').reduce((sum, p) => sum + Number(p.platform_fee || 0), 0);
  const openDisputes = allDisputes.filter(d => d.status === 'open').length;
  const confirmedSessions = allSessions.filter(s => s.status === 'confirmed' || s.status === 'completed').length;
  const pendingPayouts = allPayments.filter(p => p.status === 'paid' && !p.released_at).length;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-num">${totalStudents}</div><div class="stat-lbl">Students</div></div>
    <div class="stat-card"><div class="stat-num">${totalTutors}</div><div class="stat-lbl">Tutors</div></div>
    <div class="stat-card"><div class="stat-num">${confirmedSessions}</div><div class="stat-lbl">Sessions Booked</div></div>
    <div class="stat-card"><div class="stat-num">€${totalRevenue.toFixed(2)}</div><div class="stat-lbl">Platform Revenue</div></div>
    <div class="stat-card"><div class="stat-num" style="color:${openDisputes > 0 ? 'var(--red)' : 'var(--ink)'};">${openDisputes}</div><div class="stat-lbl">Open Disputes</div></div>
    <div class="stat-card"><div class="stat-num">${pendingPayouts}</div><div class="stat-lbl">Pending Payouts</div></div>
  `;

  const recent = [...allPayments].slice(0, 8).map(p => {
    const s = allSessions.find(s => s.id === p.session_id);
    return `<div style="display:flex;justify-content:space-between;padding:0.6rem 0;border-bottom:1px solid var(--off);font-size:0.82rem;">
      <span>${s?.subject || p.type || 'Payment'}</span>
      <span style="font-weight:700;">${p.currency === 'USD' ? '$' : '€'}${p.amount} <span class="badge ${p.status === 'refunded' ? 'badge-red' : p.status === 'released' ? 'badge-green' : 'badge-gray'}">${p.status}</span></span>
    </div>`;
  }).join('');
  document.getElementById('recentActivity').innerHTML = recent || '<div class="empty-state">No activity yet.</div>';
}

// ── DISPUTES ──
function setDisputeFilter(f, el) {
  disputeFilter = f;
  document.querySelectorAll('#page-disputes .filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderDisputes();
}

function renderDisputes() {
  const filtered = allDisputes.filter(d => d.status === disputeFilter);
  const list = document.getElementById('disputesList');

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state">No ${disputeFilter} disputes.</div>`;
    return;
  }

  list.innerHTML = filtered.map(d => {
    const s = d.sessions;
    if (d.status === 'resolved') {
      return `<div class="dispute-card">
        <div style="display:flex;justify-content:space-between;"><strong>${s?.subject || 'Session'}</strong><span class="badge badge-green">${d.resolution}</span></div>
        <div style="font-size:0.78rem;color:var(--mid);margin-top:4px;">${s?.student_name || '?'} & ${s?.tutor_name || '?'} · Resolved ${new Date(d.resolved_at).toLocaleDateString()}</div>
        <div style="font-size:0.8rem;color:var(--mid);font-style:italic;margin-top:6px;">${d.resolution_notes || 'No notes.'}</div>
      </div>`;
    }
    return `<div class="dispute-card">
      <div style="display:flex;justify-content:space-between;"><strong>${s?.subject || 'Session'}</strong><span class="badge badge-amber">open</span></div>
      <div style="font-size:0.78rem;color:var(--mid);margin-top:4px;">Between ${s?.student_name || '?'} and ${s?.tutor_name || '?'} · ${new Date(d.created_at).toLocaleDateString()}</div>
      <div class="dispute-reason">"${d.reason}"</div>
      <div class="resolve-row">
        <button class="resolve-btn release" onclick="resolveDispute('${d.id}','released',this)">✅ Release to tutor</button>
        <button class="resolve-btn refund" onclick="resolveDispute('${d.id}','refunded',this)">↩️ Full refund</button>
        <button class="resolve-btn partial" onclick="togglePartial('${d.id}',this)">➗ Partial</button>
        <input type="number" class="partial-amount-input" id="partial-${d.id}" placeholder="Amount" step="0.5">
        <input type="text" class="notes-input" id="notes-${d.id}" placeholder="Notes (optional)">
      </div>
    </div>`;
  }).join('');
}

function togglePartial(id, btn) {
  const input = document.getElementById('partial-' + id);
  const show = input.style.display !== 'inline-block';
  input.style.display = show ? 'inline-block' : 'none';
  if (show) { input.focus(); btn.onclick = () => resolveDispute(id, 'partial', btn); }
}

async function resolveDispute(disputeId, resolution, btn) {
  const notes = document.getElementById('notes-' + disputeId)?.value || '';
  const refundAmount = resolution === 'partial' ? parseFloat(document.getElementById('partial-' + disputeId)?.value) : undefined;

  if (resolution === 'partial' && (!refundAmount || refundAmount <= 0)) { alert('Enter a valid partial refund amount.'); return; }

  const msg = resolution === 'released' ? 'Release payment to the tutor?' : resolution === 'refunded' ? 'Issue a full refund?' : `Refund ${refundAmount} to the student?`;
  if (!confirm(msg)) return;

  btn.disabled = true; btn.textContent = 'Processing...';

  const res = await fetch(`${SUPABASE_URL}/functions/v1/resolve-dispute`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dispute_id: disputeId, admin_id: adminUser.id, resolution, resolution_notes: notes, refund_amount: refundAmount }),
  });
  const data = await res.json();
  if (data.error) { alert('Error: ' + data.error); btn.disabled = false; return; }
  await loadEverything();
}

// ── TRANSACTIONS ──
function setTxnFilter(f, el) {
  txnFilter = f;
  document.querySelectorAll('#page-transactions .filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderTransactions();
}

function renderTransactions() {
  let filtered = allPayments;
  if (txnFilter !== 'all') filtered = allPayments.filter(p => p.status === txnFilter);

  const rows = filtered.map(p => {
    const s = allSessions.find(s => s.id === p.session_id);
    const sym = p.currency === 'USD' ? '$' : '€';
    const badgeClass = p.status === 'refunded' || p.status === 'partially_refunded' ? 'badge-red' : p.status === 'released' ? 'badge-green' : 'badge-gray';
    return `<tr>
      <td>${new Date(p.paid_at || p.created_at || Date.now()).toLocaleDateString()}</td>
      <td>${s?.subject || p.type || '—'}</td>
      <td>${sym}${p.amount}</td>
      <td>${sym}${p.platform_fee || 0}</td>
      <td>${sym}${p.tutor_payout || 0}</td>
      <td><span class="badge ${badgeClass}">${p.status}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('transactionsTable').innerHTML = filtered.length === 0
    ? '<div class="empty-state">No transactions found.</div>'
    : `<table><thead><tr><th>Date</th><th>Session</th><th>Amount</th><th>Fee</th><th>Payout</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ── SESSIONS ──
function setSessionFilter(f, el) {
  sessionFilter = f;
  document.querySelectorAll('#page-sessions .filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderSessions();
}

function renderSessions() {
  let filtered = allSessions;
  if (sessionFilter !== 'all') filtered = allSessions.filter(s => s.status === sessionFilter);

  const rows = filtered.slice(0, 100).map(s => {
    const badgeMap = { confirmed: 'badge-green', completed: 'badge-gray', cancelled: 'badge-red', payment_expired: 'badge-red', awaiting_payment: 'badge-amber', pending: 'badge-amber' };
    return `<tr>
      <td>${s.scheduled_date ? new Date(s.scheduled_date).toLocaleDateString() : '—'}</td>
      <td>${s.subject || '—'}</td>
      <td>${s.student_name || '—'}</td>
      <td>${s.tutor_name || '—'}</td>
      <td>${s.currency === 'USD' ? '$' : '€'}${s.price || 0}</td>
      <td><span class="badge ${badgeMap[s.status] || 'badge-gray'}">${s.status}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('sessionsTable').innerHTML = filtered.length === 0
    ? '<div class="empty-state">No sessions found.</div>'
    : `<table><thead><tr><th>Date</th><th>Subject</th><th>Student</th><th>Tutor</th><th>Price</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ── GROUP SESSIONS ──
function renderGroupSessions() {
  if (allGroupSessions.length === 0) {
    document.getElementById('groupSessionsTable').innerHTML = '<div class="empty-state">No group sessions yet.</div>';
    return;
  }
  const rows = allGroupSessions.map(gs => {
    const confirmed = (gs.group_session_participants || []).filter(p => p.status === 'confirmed').length;
    const badgeMap = { open: 'badge-amber', completed: 'badge-gray', cancelled: 'badge-red' };
    return `<tr>
      <td>${new Date(gs.scheduled_date).toLocaleDateString()}</td>
      <td>${gs.subject}</td>
      <td>${gs.tutor_name || '—'}</td>
      <td>${confirmed}/${gs.max_students}</td>
      <td>${gs.currency === 'USD' ? '$' : '€'}${gs.price_per_student}</td>
      <td><span class="badge ${badgeMap[gs.status] || 'badge-gray'}">${gs.status}</span></td>
    </tr>`;
  }).join('');
  document.getElementById('groupSessionsTable').innerHTML = `<table><thead><tr><th>Date</th><th>Subject</th><th>Tutor</th><th>Joined</th><th>Price</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ── USERS ──
function setUserFilter(f, el) {
  userFilter = f;
  document.querySelectorAll('#page-users .filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderUsers();
}

function renderUsers() {
  const search = (document.getElementById('userSearch')?.value || '').toLowerCase();
  let filtered = allUsers;

  if (userFilter === 'tutor') filtered = filtered.filter(u => u.roles?.includes('tutor'));
  else if (userFilter === 'student') filtered = filtered.filter(u => u.roles?.includes('student'));
  else if (userFilter === 'suspended') filtered = filtered.filter(u => u.suspended_at);

  if (search) filtered = filtered.filter(u => (u.full_name || '').toLowerCase().includes(search) || (u.email || '').toLowerCase().includes(search));

  const rows = filtered.slice(0, 150).map(u => {
    const roleLabel = (u.roles || []).join(', ') || u.role || '—';
    return `<tr>
      <td>${u.full_name || '—'}</td>
      <td>${u.email || '—'}</td>
      <td>${roleLabel}</td>
      <td>${u.created_at ? new Date(u.created_at).toLocaleDateString() : '—'}</td>
      <td>${u.suspended_at ? '<span class="badge badge-red">suspended</span>' : '<span class="badge badge-green">active</span>'}</td>
      <td>${u.suspended_at
        ? `<button class="unsuspend-btn" onclick="unsuspendUser('${u.id}')">Unsuspend</button>`
        : `<button class="suspend-btn" onclick="suspendUser('${u.id}')">Suspend</button>`}</td>
    </tr>`;
  }).join('');

  document.getElementById('usersTable').innerHTML = filtered.length === 0
    ? '<div class="empty-state">No users found.</div>'
    : `<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function suspendUser(userId) {
  const reason = prompt('Reason for suspension (visible in admin records):');
  if (reason === null) return;
  await _sb.from('users').update({ suspended_at: new Date().toISOString(), suspended_reason: reason || null, suspended_by: adminUser.id }).eq('id', userId);
  await loadEverything();
}

async function unsuspendUser(userId) {
  if (!confirm('Lift this suspension?')) return;
  await _sb.from('users').update({ suspended_at: null, suspended_reason: null, suspended_by: null }).eq('id', userId);
  await loadEverything();
}

// ── NOTIFICATIONS ──
async function loadNotifications() {
  const { data } = await _sb.from('notifications').select('*').eq('user_id', adminUser.id).order('created_at', { ascending: false }).limit(30);
  const notifs = data || [];
  const unread = notifs.filter(n => !n.read).length;

  const badge = document.getElementById('notifBadge');
  if (unread > 0) { badge.textContent = unread; badge.style.display = 'inline-block'; }
  else badge.style.display = 'none';

  document.getElementById('notifPanelBody').innerHTML = notifs.length === 0
    ? '<div class="empty-state">No notifications yet.</div>'
    : notifs.map(n => `
      <div class="notif-row ${n.read ? '' : 'unread'}" onclick="markNotifRead('${n.id}')">
        <div class="notif-row-title">${n.title || 'Notification'}</div>
        <div class="notif-row-body">${n.body || ''}</div>
        <div class="notif-row-time">${new Date(n.created_at).toLocaleString()}</div>
      </div>`).join('');
}

async function markNotifRead(id) {
  await _sb.from('notifications').update({ read: true }).eq('id', id);
  await loadNotifications();
}

function toggleNotifPanel() {
  document.getElementById('notifPanel').classList.toggle('open');
}

// ── INIT ──
document.addEventListener('DOMContentLoaded', checkAdminAccess);
</script>
