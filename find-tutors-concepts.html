<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Find a Tutor · 4 concepts (preview)</title>
<link rel="icon" href="favicon.ico?v=20261101" sizes="any">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Comparison shell for the four Find a Tutor concepts. Each concept is a real page in a frame,
   so the phone view is a true 390px layout with live data. Preview only, not linked from the site. */
:root{--bar:#0f2460;--bar-2:#1a3478;--t2:#b9c6e4;--accent:#28a9e0;--bg:#eef1f6;--card:#fff;--ink:#0b1530;--mute:#5b6478;--line:#d9dfe8;--rec:#ffd84d}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 'Manrope',system-ui,sans-serif;display:flex;flex-direction:column}
.bar{background:var(--bar);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px}
.bar h1{font-size:14px;margin:0;font-weight:800;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.bar button{font:700 13px/1 'Manrope',sans-serif;color:var(--t2);background:transparent;border:1px solid transparent;border-radius:999px;padding:9px 12px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.bar button:hover{color:#fff;background:var(--bar-2)}
.tabs button[aria-selected="true"]{background:#fff;color:var(--bar)}
.rec{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--rec);color:#3a2d00;padding:3px 6px;border-radius:999px}
.right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:2px;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:2px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#04203a}
.about{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline}
.about span{color:var(--mute);flex:1 1 380px;min-width:0}
.data{font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;background:#e8f6f0;color:#0b7a55}
.data.demo{background:#fff6e0;color:#8a5a00}
.stage{flex:1;min-height:0;display:flex;justify-content:center}
.stage.phone{padding:18px 16px;overflow:auto;align-items:flex-start}
iframe{width:100%;border:0;background:#fff;display:block}
.stage.phone iframe{width:390px;max-width:100%;height:780px;border-radius:34px;box-shadow:0 0 0 10px #10151f,0 30px 60px -20px rgba(0,0,0,.5)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:700px){.bar h1{display:none}.right{margin-left:0}}
</style>
</head>
<body>
<header class="bar">
  <h1>Find a Tutor · 4 concepts</h1>
  <nav class="tabs" role="tablist" aria-label="Concepts">
    <button role="tab" data-c="a" aria-selected="true">A · Minimalist</button>
    <button role="tab" data-c="b" aria-selected="false">B · Next-gen</button>
    <button role="tab" data-c="c" aria-selected="false">C · Student-first</button>
    <button role="tab" data-c="d" aria-selected="false">D · Smart discovery <span class="rec">Recommended</span></button>
  </nav>
  <div class="right">
    <div class="seg" role="group" aria-label="Data"><button type="button" data-m="real" aria-pressed="true">Real tutors</button><button type="button" data-m="demo" aria-pressed="false">+ Sample tutors</button></div>
    <div class="seg" role="group" aria-label="Device"><button type="button" data-d="desktop" aria-pressed="true">Desktop</button><button type="button" data-d="phone" aria-pressed="false">Phone</button></div>
  </div>
</header>
<div class="about" aria-live="polite"><b id="aT"></b><span id="aD"></span><span class="data" id="dataL">Live data from UniSkilled</span></div>
<main class="stage" id="stage"><iframe id="f" title="Concept preview"></iframe></main>
<script>
(function () {
  var info = {
    a: ['Premium Minimalist', 'One big search with suggestions, a single filter bar (subject, budget, days, university, sort) and calm cards with a weekly availability strip. Click a card for a slide-in preview with Book.'],
    b: ['Next-generation EdTech', 'Navy discovery band where subjects are tiles with live tutor counts, a filter rail (a bottom sheet on phones) and result rows that expand in place to show details and Book.'],
    c: ['Student-first Discovery', 'Search by what you need and where you study, academic background on every card, and compare up to three tutors side by side before booking.'],
    d: ['Smart Discovery', 'One search box that understands days, times and budget ("statistics sunday evening under 25"), results that explain why they match, and a sticky profile preview with Book. Recommended.']
  };
  var f = document.getElementById('f'), stage = document.getElementById('stage'), c = 'a', dev = 'desktop', mode = 'real';
  function src() { var s = 'find-tutors-concept-' + c + '.html' + (mode === 'demo' ? '?demo=1' : ''); if (f.getAttribute('src') !== s) f.setAttribute('src', s); }
  function size() { f.style.height = dev === 'phone' ? '780px' : stage.clientHeight + 'px'; }
  function show(x, push) {
    if (!info[x]) x = 'a'; c = x;
    document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.c === x ? 'true' : 'false'); });
    document.getElementById('aT').textContent = x.toUpperCase() + ' · ' + info[x][0];
    document.getElementById('aD').textContent = info[x][1];
    src(); if (push) location.hash = x;
  }
  document.querySelectorAll('.tabs button').forEach(function (b) { b.onclick = function () { show(b.dataset.c, true); }; });
  document.querySelectorAll('[data-d]').forEach(function (b) { b.onclick = function () { dev = b.dataset.d; document.querySelectorAll('[data-d]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); stage.classList.toggle('phone', dev === 'phone'); size(); }; });
  document.querySelectorAll('[data-m]').forEach(function (b) { b.onclick = function () { mode = b.dataset.m; document.querySelectorAll('[data-m]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); var l = document.getElementById('dataL'); l.textContent = mode === 'demo' ? 'Live data + labelled sample tutors (not bookable)' : 'Live data from UniSkilled'; l.classList.toggle('demo', mode === 'demo'); src(); }; });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
  window.addEventListener('resize', size);
  show(location.hash.slice(1) || 'a'); size();
})();
</script>
</body>
</html>
